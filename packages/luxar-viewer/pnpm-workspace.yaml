onlyBuiltDependencies:
  - esbuild

# Security-advisory pins. THIS FILE IS THE ONLY HOME FOR `overrides` — do not
# add a `pnpm.overrides` block to package.json. Every pnpm that can read this
# file (>=10.6; 10.4 and older reject it with "packages field missing or
# empty") silently PREFERS package.json when both exist, while Dependabot's
# updater reads THIS file. A second copy therefore makes the two disagree, and
# every Dependabot PR lands a lockfile that fails `pnpm install
# --frozen-lockfile` with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH. Because the pins
# live here, pnpm <10.6 would install without them — hence `engines.pnpm`,
# MIN_PNPM_MAJOR/MINOR in the Makefile, and every workflow's pnpm pin.
# `pnpm run check:overrides` enforces the single-source rule.
overrides:
  ws@>=8.0.0 <8.20.1: '>=8.20.1'
  brace-expansion@>=5.0.0 <5.0.6: '>=5.0.6'
  esbuild@>=0.17.0 <0.28.1: '>=0.28.1'
  form-data@>=4.0.0 <4.0.6: '>=4.0.6'
  linkify-it@<=5.0.0: '>=5.0.1'
  markdown-it@<=14.1.1: '>=14.2.0'
  js-yaml@>=4.0.0 <=4.1.1: '>=4.2.0 <5.0.0'
