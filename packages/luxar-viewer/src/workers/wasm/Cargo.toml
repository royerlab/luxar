[package]
name = "luxar-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Luxar Contributors"]
description = "WASM acceleration for Luxar spatial queries and nD visibility computation"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3           # Maximum optimization
lto = true              # Link-time optimization
codegen-units = 1       # Better optimization (slower compile)
panic = "abort"         # Smaller binary size
strip = true            # Strip debug symbols

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory"]  # Optimize with SIMD and bulk memory
