[package]
name = "luxar-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
authors = ["Luxar Contributors"]
description = "WASM acceleration for Luxar spatial queries and nD visibility computation"
license = "BSD-3-Clause"
repository = "https://github.com/royerlab/luxar"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# js-sys: used by DepthSorter::read_ordering_into for the single-memcpy
# ordering readback (Uint32Array::view over wasm memory + target.set()).
# Compiles fine for native `cargo test` targets (JS calls are never made there).
js-sys = "0.3"
# Note: Manual SIMD (wide crate) was tested but showed no benefit over simple loops
# when compiled to WASM. The compiler auto-vectorization is sufficient.

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3           # Maximum optimization
lto = true              # Link-time optimization
codegen-units = 1       # Better optimization (slower compile)
panic = "abort"         # Smaller binary size
strip = true            # Strip debug symbols

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]
