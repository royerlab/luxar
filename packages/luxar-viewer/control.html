<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No user scaling: this is a fixed menu on a plinth, and an accidental
         pinch is pure confusion for the next visitor. -->
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Luxar Control Panel</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎛️</text></svg>"
    />
    <!-- Globals only. Everything the panel itself needs is imported by
         `src/core/control-panel/main.ts`, matching how `index.html` works and
         what the stylesheet-contract test expects (no <link> to src/styles). -->
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background-color: #101014;
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/core/control-panel/main.ts"></script>
  </body>
</html>
