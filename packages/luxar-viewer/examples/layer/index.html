<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LuxarLayer — host-owned Three.js renderer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, system-ui, sans-serif;
        background: #0b1020;
        color: #e7ecff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
      }
      header {
        padding: 14px 18px;
        display: flex;
        align-items: baseline;
        gap: 16px;
        background: #111831;
        border-bottom: 1px solid #2b355e;
      }
      h1 {
        margin: 0;
        font-size: 18px;
      }
      #status {
        color: #9eabd9;
        font-size: 13px;
      }
      main {
        position: relative;
        min-height: 0;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .hint {
        position: absolute;
        left: 16px;
        bottom: 14px;
        padding: 7px 10px;
        border-radius: 6px;
        background: rgb(7 11 24 / 78%);
        color: #b7c2ec;
        font-size: 12px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LuxarLayer host example</h1>
      <span id="status">Loading…</span>
    </header>
    <main id="viewport">
      <canvas id="layer-canvas"></canvas>
      <div class="hint">Drag to orbit · scroll to dolly</div>
    </main>
    <script type="module" src="./layer.js"></script>
  </body>
</html>
