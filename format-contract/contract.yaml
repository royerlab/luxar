# Luxar cross-language format contract — SINGLE SOURCE OF TRUTH.
#
# This file is the authoritative descriptor of the format vocabulary that the
# Python WRITER (luxar) and the TypeScript CONSUMER (@luxar/viewer) must agree
# on. Rust holds zero format strings (it exposes one decode function per scheme
# and TS decides which to call), so it is intentionally NOT a party here.
#
# Edit THIS file, then regenerate the language projections:
#     make gen-contract          # or: hatch run gen-contract
# Generated artifacts (DO NOT EDIT BY HAND):
#     packages/luxar/src/luxar/typing_utils/_format_contract.py
#     packages/luxar-viewer/src/types/format-contract.ts
# The CI gate `hatch run check-contract` fails if either projection drifts from
# this file, so a new version / encoding / node kind is a one-file edit that
# cannot silently desync the two languages.
#
# Source of record for the values below: docs/specs/GSPLATS_ZARR_FORMAT.md.

# Scene (.luxar.zarr) format version.
#   Python source of truth today: typing_utils/constants.py, typing_utils/config.py
scene_format:
  current: "0.1"
  supported: ["0.1", "0.2", "0.3"]

# Standalone gsplats (.gsplats.zarr) node-tree format version.
#   Python: gsplats/io/save_gsplats.py   TS: data/scene-loader/.../load-scene.ts
gsplats_format:
  current: "3.4"
  supported: ["3.0", "3.1", "3.2", "3.3", "3.4"]

# Root-header `format_type` attr that identifies a standalone gsplats store.
format_type_gsplats: "gsplats_zarr"

# Scene-graph node geometry/container types.
#   Python: typing_utils/enums.py::NodeType   TS: types/data-monitor-types.ts
node_types: ["scene", "group", "points", "lines", "gsplats", "mesh"]

# The LEAF subset of `node_types` — the first-class geometry types that carry
# element data (as opposed to the `scene` / `group` containers). This is the
# VOCABULARY: "is this node a geometry leaf?". It is what the Python writer side
# asks — does this node contribute position_bounds, is it a leaf for `luxar info`
# and LOD backfill — and every geometry type belongs here from the moment it can
# be written, whether or not the viewer can draw it yet.
#   Python: io/_compiler/{bounds.py,finalize/lod_backfill.py}, cli/info_command.py
#   TS: types/format-contract.ts::GeometryTypeName
# The generator enforces that this is non-empty, a subset of `node_types`, free
# of the container types, and duplicate-free.
geometry_types: ["points", "lines", "gsplats", "mesh"]

# The subset of `geometry_types` the VIEWER can load and draw — the types that
# have a loader, a GEOMETRY_DESCRIPTORS row and a hidden-dim tolerance arm.
#
# This is a CAPABILITY, not a vocabulary, and the distinction is load-bearing in
# both directions. Keying the viewer's dispatch tables on `geometry_types` would
# mean a newly-authorable type silently resolves to no loader; keying the Python
# writer's leaf checks on `loader_types` would mean a writable type's bounds are
# silently skipped. So the two lists are named separately and each consumer picks
# the one that matches the question it is asking. Adding a type here is the
# deliberate "switch it on in the viewer" step, and omitting it is a COMPILE
# ERROR at `LoaderByKind`, `GEOMETRY_DESCRIPTORS`, `PARTIAL_EXTEND_TOLERANCE`
# and `computeHiddenDimTolerance` — never a silent gap.
#
#   TS: data/data-loader-types.ts::GeometryKind
# The generator enforces that this is non-empty, a subset of `geometry_types`,
# and duplicate-free.
loader_types: ["points", "lines", "gsplats", "mesh"]

# Specialized-group kinds written by the compiler.
#   Python: io/_compiler/gsplat_tree.py   TS: types/data-monitor-types.ts
node_kinds: ["lod", "partition"]

# On-disk array encoding scheme names: emitted by the Python ArrayEncoder,
# recognized by the TS ArrayDecoder. NOTE the two bit-width suffix conventions
# are NOT interchangeable: the per-channel family uses `_uN`; the scalar /
# bounded / geolog-scalar / lut / rgb families use `_uintN`.
#
# The split is KEPT DELIBERATELY, not tolerated. Both spellings are live in
# published stores -- a scan of the built demo and example stores found every
# one of them carrying at least one encoding attr, including 156 occurrences of
# the short `_uN` form -- so renaming either convention would invalidate every
# published store and every checksum-pinned Zenodo record, or else require a
# third alias vocabulary that is strictly worse than the wart. The names are
# wire format; they are not free to tidy.
#
# What the split costs is that the wrong sibling of a real name reads exactly as
# plausibly as the real one. That is a documentation hazard before it is a code
# one, and its source is identifiable: the WASM/TS decode kernels are named
# `decode_<family>_u8` -- short form, uniformly, by Rust convention -- while the
# value they read off disk may be `<family>_uint8`. An author reads the kernel,
# writes its spelling into prose, and the next author copies the prose into an
# f-string that produces a store no decoder can read.
#
# So the split is enforced rather than merely documented:
#   encoding/tests/test_encoding_vocabulary.py     no document may NAME a
#                                                  non-existent sibling
#   encoding/tests/test_emitted_names_contract.py  every name the encoder EMITS
#                                                  is here, and every quantized
#                                                  name here is reachable
#   encoding/tests/test_custom_dispatch_contract   the CUSTOM dispatch keys
#   viewer .../format-contract.test.ts             the decoder knows every name
encodings:
  - none
  - broadcasted
  - array_ref
  - lut_uint8
  - lut_uint16
  - rgb_uint8
  - rgb_uint16
  - bounded_scalar_uint8
  - bounded_scalar_uint16
  - geolog_scalar_uint8
  - geolog_scalar_uint16
  - log_scalar_uint8
  - log_scalar_uint16
  - linear_perchannel_u8
  - linear_perchannel_u16
  - log_perchannel_u8
  - log_perchannel_u16
  - signed_log_perchannel_u8
  - signed_log_perchannel_u16
  - geolog_perchannel_u8
  - geolog_perchannel_u16
  - float16
  - float32
  - uint8
  - uint16
  - uint32
  - uint64

# Canonical metadata attribute keys on scene/gsplats nodes.
attr_keys:
  - format_version
  - format_type
  - content_hash
  - display_type
  - max_elements
  - position_bounds
  - kind

# Canonical array names inside a gsplats node (v3.1 split the packed
# `cholesky_factors` into `_diag` + `_offdiag`; the packed name stays a read
# fallback for v3.0 stores).
array_names:
  - centers
  - amplitudes
  - cholesky_factors
  - cholesky_factors_diag
  - cholesky_factors_offdiag
  - colors
  - label_ids
