<!DOCTYPE html>
<html>
<head>
    <title>Debug Viewer</title>
</head>
<body>
    <div id="info" style="position: fixed; top: 10px; left: 10px; background: white; padding: 10px; z-index: 1000;">
        Loading...
    </div>
    <script type="module">
        // Open developer console to see logs
        console.log('Starting debug viewer...');
        
        // Load the viewer
        const iframe = document.createElement('iframe');
        iframe.src = 'http://localhost:5173/?src=zarr_scenes/test_5d_dense_grid.zarr';
        iframe.style.width = '100vw';
        iframe.style.height = '100vh';
        iframe.style.border = 'none';
        document.body.appendChild(iframe);
        
        // Monitor console logs
        const info = document.getElementById('info');
        info.innerHTML = 'Check browser console for logs';
    </script>
</body>
</html>
