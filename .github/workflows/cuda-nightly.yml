name: CUDA native cadence

# Dispatched by the off-peak timer in royerlab/luxar-ci with `--ref dev`.
# That dispatcher pins this filename as `cuda-nightly.yml`; renaming it silently
# stops the cadence.
# workflow_dispatch is not registered until this file reaches the default branch
# (main) through promotion; after that, `--ref dev` tests and attests the dev SHA.
# Keeping this out of `schedule:` is load-bearing: scheduled workflows follow
# the repository default branch, while this check must attest the dev commit.
on:
  workflow_dispatch:

concurrency:
  group: cuda-native-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cuda-native:
    name: CUDA compile and parity (two GPUs)
    runs-on: [self-hosted, obsidian-cuda]
    permissions:
      contents: read
      issues: write
    timeout-minutes: 75
    env:
      LUXAR_REQUIRE_CUDA: "1"
      MAX_JOBS: "2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup-python
        with:
          python-version: "3.12"

      - name: Reuse Hatch env on persistent runners
        # LUXAR_CI_HATCH_BASE is a dedicated, per-runner volume. Refresh the
        # dependency resolution weekly and expire keys unused for seven days.
        # Hosted runners leave the variable unset, so this script is a no-op.
        run: bash "$GITHUB_WORKSPACE/scripts/ci_hatch_env_cache.sh" "${{ hashFiles('pyproject.toml') }}"
      - name: Install Hatch
        timeout-minutes: 5
        run: pipx install --python "${{ steps.setup-python.outputs.python-path }}" hatch

      - name: Require the two-GPU CUDA runner
        timeout-minutes: 15
        run: |
          hatch run python -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() >= 2, torch.cuda.device_count()"

      - name: Compile-check CUDA translation units
        timeout-minutes: 5
        run: hatch run check-native --only nvcc --require nvcc

      - name: Build CUDA extensions
        timeout-minutes: 20
        run: |
          make build-cuda
          make build-nlm-cuda

      - name: Run CUDA parity suites
        timeout-minutes: 20
        run: |
          make test-cuda
          make test-nlm-cuda

      - name: Run CUDA parity suites on the NVRTC runtime-compiled kernels
        # The path a plain `pip install` takes: same suites, kernels compiled at
        # runtime by NVRTC instead of the extensions built above. Forcing the
        # backend makes an unavailable NVRTC fail rather than fall back.
        # ~2-3 min measured on obsidian (both GPUs visible).
        timeout-minutes: 10
        env:
          LUXAR_CUDA_BACKEND: nvrtc
          XDG_CACHE_HOME: ${{ runner.temp }}/luxar-nvrtc-cache
        run: |
          hatch run pytest packages/luxar/src/luxar/gsplats/models/gsplats/cuda/tests/ \
            packages/luxar/src/luxar/gsplats/preprocessing/tests/test_nlm_cuda.py \
            packages/luxar/src/luxar/gsplats/tests/test_nvrtc.py -v -rs

      - name: Report cadence failure
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const title = "CUDA native cadence failure";
            const body = `Run ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${context.runId} failed or was cancelled for commit \`${context.sha}\`.`;
            const { owner, repo } = context.repo;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => !issue.pull_request && issue.title === title,
            );
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                assignees: ["royerloic"],
              });
            }
