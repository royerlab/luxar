name: Coverage

# This workflow records a non-cancellable 89% coverage result for every dev commit.
#
# ci.yml runs coverage-instrumented tests (`test-cov`) as the dominant cost of
# `python-tests` (~60-90 min under contention), so PRs run the suite WITHOUT
# coverage (`test-nocov`) to lift the merge-rate ceiling. The protected
# `python-tests (3.12)` push leg in ci.yml remains the promotion-visible gate;
# this workflow's `coverage` context is advisory until repository protection
# requires it. A schedule trigger would not even attach this reliable result to
# the tested dev commit: a
# scheduled run's checks attach to the default branch's tip (`github.sha`), not
# the dev commit it checks out, so promotion -- which enumerates
# `dev --not main` and reads check-runs per candidate -- would never see the
# verdict, and a green cron leg would even stamp success onto main's tip for a
# tree main does not contain.
#
# A `push` to `dev` attaches `github.sha` to the dev commit itself, so this
# workflow's check-run lands on the commit it describes. The per-commit
# `concurrency` group with `cancel-in-progress: false` means no push ever
# cancels another coverage run -- each dev commit's coverage completes.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  # Per-COMMIT, and never cancelled: every dev commit gets its own coverage run
  # to completion. (ci.yml's group is event+ref keyed with cancel-in-progress,
  # which is exactly why its own push coverage leg is not a reliable record.)
  group: coverage-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coverage:
    # push-to-dev and workflow_dispatch are never fork events (only collaborators
    # push to dev), so this can default straight to the self-hosted box without
    # ci.yml's pick-runner fork guard. Keep the same outage break-glass.
    runs-on: ${{ vars.LUXAR_CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || 'obsidian' }}
    # Same reasoning as ci.yml's python-tests: the self-hosted runners are
    # SCHED_IDLE, so a starved-but-healthy leg can stretch well past an hour.
    timeout-minutes: 180
    env:
      # Match python-tests' obsidian execution exactly (see ci.yml for the full
      # rationale): pin BLAS/OpenMP to one thread per process and run the
      # coverage-traced suite under a memory-safe 2 xdist workers with
      # `--dist loadfile` so shared fixtures stay on one worker.
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      PYTEST_ADDOPTS: ${{ vars.LUXAR_CI_FORCE_HOSTED != '1' && '-n 2 --dist loadfile' || '' }}
    steps:
      - name: Free disk space on hosted runners
        # No-op on obsidian (ample disk); kept so a forced-hosted fallback stays
        # green under the ~14 GB GitHub-hosted disk (see ci.yml, #1816).
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      # LFS intentionally disabled (see ci.yml): payload tests skip on pointer
      # stubs, so a checkout never needs LFS bandwidth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: '3.12'

      - name: Install Hatch
        # Install Hatch ON the 3.12 interpreter so the hatch env is really 3.12
        # (a plain `pipx install hatch` would pin whatever pipx picked; see #839).
        run: pipx install --python "${{ steps.setup-python.outputs.python-path }}" hatch

      - name: Assert hatch uses 3.12
        # Prove the hatch env runs the version this job claims (the #839 guard).
        run: |
          got=$(hatch run python -c "import sys; print(sys.version_info.major, sys.version_info.minor, sep='.')")
          echo "hatch-env=$got"
          if [ "3.12" != "$got" ]; then
            echo "::error::hatch env runs $got but coverage runs on 3.12 (see #839)"
            exit 1
          fi

      - name: Test with coverage (89% fail_under)
        # `hatch run test-cov` = `pytest -m 'not slow' --cov=luxar ...`; the 89%
        # floor is enforced by [tool.coverage.report] fail_under in pyproject.toml.
        # A regression reddens this advisory run on the dev commit. The protected
        # ci.yml push leg is the promotion-visible enforcement path for now.
        run: hatch run test-cov
