name: CUDA native cadence

# Dispatched by the off-peak timer in royerlab/luxar-ci with `--ref dev`.
# workflow_dispatch is not registered until this file reaches the default branch
# (main) through promotion; after that, `--ref dev` tests and attests the dev SHA.
# Keeping this out of `schedule:` is load-bearing: scheduled workflows follow
# the repository default branch, while this check must attest the dev commit.
on:
  workflow_dispatch:

concurrency:
  group: cuda-native-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cuda-native:
    name: CUDA compile and parity (two GPUs)
    runs-on: [self-hosted, obsidian-cuda]
    permissions:
      contents: read
      issues: write
    timeout-minutes: 60
    env:
      LUXAR_REQUIRE_CUDA: "1"
      MAX_JOBS: "2"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        with:
          python-version: "3.12"

      - name: Install Hatch
        timeout-minutes: 10
        run: pipx install --python "${{ steps.setup-python.outputs.python-path }}" hatch

      - name: Require the two-GPU CUDA runner
        run: |
          hatch run python -c "import torch; assert torch.cuda.is_available(); assert torch.cuda.device_count() >= 2, torch.cuda.device_count()"

      - name: Compile-check CUDA translation units
        timeout-minutes: 10
        run: hatch run check-native --only nvcc --require nvcc

      - name: Build CUDA extensions
        timeout-minutes: 30
        run: |
          make build-cuda
          make build-nlm-cuda

      - name: Run CUDA parity suites
        timeout-minutes: 20
        run: |
          make test-cuda
          make test-nlm-cuda

      - name: Report cadence failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="CUDA native cadence failure"
          body="Run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID failed for commit \`$GITHUB_SHA\`."
          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "\"$title\" in:title" \
              --json number,title \
              --jq '.[] | select(.title == "CUDA native cadence failure") | .number' \
              | head -n 1
          )"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --assignee royerloic
          fi
