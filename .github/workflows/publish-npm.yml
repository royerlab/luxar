# Publish the Luxar Viewer library (@luxar/viewer) to npm.
#
# Sibling of publish.yml (which ships the Python package to PyPI). Same trigger:
# pushing a version tag (e.g. `v2026.06.29`). The tag MUST match the `version`
# in packages/luxar-viewer/package.json (CalVer `YYYY.MM.DD`, zero-padded) or the
# job fails fast before publishing. Keep package.json's version in lockstep with
# the Python __version__ via `make set-version DATE=YYYY.MM.DD`.
#
# What gets published is the LIBRARY bundle built by `pnpm run ci:release`
# (build:lib -> dist/lib/** + a sanity check that `three` is externalized and the
# barrel is side-effect-free). This is independent of the standalone viewer app
# that `pnpm build` produces and that the Python wheel bundles.
#
# ── ONE-TIME npm-side setup (Step 1 DONE 2026-09-02; Steps 2-4 at launch) ─────
# Target end-state: token-less OIDC trusted publishing with provenance, mirroring
# the PyPI setup in publish.yml. KEY GOTCHA: unlike PyPI, npm has no "pending
# publisher" — a trusted publisher can only be attached to a package that ALREADY
# exists, so the FIRST publish must bootstrap with a token (Step 2); OIDC takes
# over from the second release on (Steps 3-4).
#
#   1. ACCOUNT + ORG (once) — DONE 2026-09-02: account `royerloic` with 2FA, the
#      free `luxar` org created (scope reserved; `royerlab` held defensively),
#      org-wide 2FA enforcement on. The scope had to exist before any `@luxar/*`
#      publish; it does. Note the UNSCOPED `luxar` on npm belongs to an unrelated
#      package, which is one reason the viewer is published under the scope.
#
#   2. BOOTSTRAP THE FIRST PUBLISH (token, once — npm needs the package to exist
#      before a trusted publisher can be attached). Easiest locally:
#          npm login                       # browser auth + 2FA
#          cd packages/luxar-viewer
#          pnpm run ci:release              # builds dist/lib (sourcemap-free)
#          npm publish --access public      # creates @luxar/viewer
#      There is deliberately no CI route for this step. This workflow stages,
#      and staging cannot create a package that does not exist yet (see 3b), so
#      flipping ENABLE_NPM_PUBLISH to bootstrap would fail after the tag was
#      spent. Bootstrap locally, then turn CI on.
#
#   3. CONFIGURE THE TRUSTED PUBLISHER (the OIDC part). On
#      npmjs.com/package/@luxar/viewer -> Settings tab -> "Trusted
#      Publisher" -> GitHub Actions, enter EXACTLY:
#          Organization or user : royerlab
#          Repository           : luxar
#          Workflow filename    : publish-npm.yml
#          Environment          : npm        (optional but recommended)
#
#   3b. STAGING CANNOT BOOTSTRAP. THE FIRST RELEASE IS A DIRECT, LOCAL PUBLISH.
#      npm changed the default on 2026-09-03: a trusted publisher created after
#      that date may `npm stage publish`, while direct `npm publish` is opt-in
#      per configuration. Luxar has never published, so the publisher created in
#      Step 3 lands under the NEW default and a plain `npm publish` from CI
#      would fail on permissions. Hence this workflow stages — which is also
#      npm's own recommendation, and puts a human 2FA gate in front of an
#      irreversible publish. LEAVE "allow direct publish" OFF.
#
#      BUT STAGING CANNOT CREATE THE PACKAGE. npm's prerequisites are explicit:
#      "The package already exists on the npm registry — you cannot stage a
#      brand-new package." @luxar/viewer currently 404s on the registry, so the
#      FIRST release must be the local, token-authenticated `npm publish` in
#      Step 2 above. Do NOT bootstrap by flipping ENABLE_NPM_PUBLISH and pushing
#      a tag: that runs the one command which cannot create the package, and it
#      fails after the tag is already spent. The job below refuses to start in
#      that state rather than discovering it at publish time.
#
#      So the order is: Step 2 (local `npm publish`, creates the package) ->
#      Step 3 (attach the trusted publisher) -> Step 4 (flip the switch). From
#      the SECOND release onward this workflow stages, and you promote:
#          npm stage list @luxar/viewer        # find the stage id
#          npm stage view <stage-id>           # inspect what CI produced
#          npm stage approve <stage-id>        # 2FA; this is what makes it public
#      Until you approve, nothing is installable — a staged version is NOT
#      published. (`npm stage publish` itself needs no 2FA, which is why CI can
#      run it.) Requires npm >= 11.15.0 and Node >= 22.14.0; the job below pins
#      npm and floor-checks both.
#
#   4. SWITCH CI TO TOKEN-LESS + TURN IT ON:
#      - Create a GitHub environment named `npm` (Settings -> Environments),
#        ideally restricted to `v*` tags.
#      - DELETE the `NPM_TOKEN` secret — with the trusted publisher configured and
#        `id-token: write` present, `npm stage publish` mints a short-lived
#        credential via OIDC automatically (the empty NODE_AUTH_TOKEN below is
#        harmless).
#      - Flip the repo variable `ENABLE_NPM_PUBLISH` to `true` (Settings ->
#        Secrets and variables -> Actions -> Variables). This is the master
#        switch: until it is `true`, tag pushes build + pack but DO NOT publish,
#        so a release never shows a failing npm job before npm is ready.
#
# Until Step 4 flips the switch, this workflow is a prepared template: tag pushes
# (and the workflow_dispatch dry-run) build + pack without publishing — no secrets
# required.
name: Publish viewer to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + pack only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-npm:
    name: Build + publish @luxar/viewer
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@luxar/viewer
    permissions:
      contents: read
      id-token: write # provenance attestation + (optional) OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Refuse a bootstrap attempt in SECONDS, not after a full build. npm
      # cannot stage a brand-new package, so on an unpublished name `npm stage
      # publish` fails — and it would fail at the very end, after Rust,
      # wasm-pack, pnpm install and the library build, with the tag already
      # pushed and spent. This needs nothing from the build, so it runs first.
      # 404 is the only "absent" answer acted on; any other curl outcome is
      # treated as reachable-but-unknown and left to npm, so a registry blip
      # cannot block a release.
      - name: Refuse to stage a package that does not exist yet
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && vars.ENABLE_NPM_PUBLISH == 'true'
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                    https://registry.npmjs.org/@luxar%2Fviewer || echo 000)"
          if [ "$code" = "404" ]; then
            echo "::error::@luxar/viewer does not exist on npm, and staging cannot create it."
            echo "::error::The FIRST release must be a local, token-authenticated 'npm publish'"
            echo "::error::(Step 2 in this file's header). Bootstrap that, attach the trusted"
            echo "::error::publisher, and only then set ENABLE_NPM_PUBLISH=true."
            exit 1
          fi
          echo "@luxar/viewer exists on the registry (HTTP $code) — staging is possible."

      - name: Set up Rust (for WASM build)
        # Explicit channel for the same reason as ci.yml and publish.yml: the
        # action is SHA-pinned, so `# stable` in the ref is a comment, not a
        # channel.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.15.0" # pinned to match ci.yml (deterministic, not 'latest')

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Read the viewer manifest's exact packageManager pin, matching CI,
          # docs, and PyPI publish. pnpm >=10.6 is required to read the security
          # overrides from the packages-less pnpm-workspace.yaml.
          package_json_file: packages/luxar-viewer/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      # OIDC trusted publishing, provenance and `npm stage` all need a recent
      # npm CLI. Pinned rather than `@latest` for the same reason the Rust
      # toolchain and wasm-pack are pinned: a release must not be built by a
      # toolchain nobody chose. 11.15.0 is the floor for staged publishing.
      - name: Install the pinned npm CLI
        run: |
          set -euo pipefail
          npm install -g npm@11.15.0
          npm --version
          node --version
          # Fail here, loudly, rather than at the staging step: if the pin ever
          # slips below the staged-publishing floor, `npm stage` does not exist
          # and the error would arrive only after the tag had been pushed.
          # Compared numerically with sort -V rather than probing `--help`,
          # whose exit code is not a reliable "does this subcommand exist".
          need=11.15.0
          have="$(npm --version)"
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            echo "::error::npm $have is below $need, which is the floor for staged publishing (npm stage)"
            exit 1
          fi
          # Node is NOT pinned -- `node-version: 22` floats the whole 22.x line --
          # so the floor is checked rather than assumed. 22.14.0 is npm's
          # documented minimum for staged publishing.
          need_node=22.14.0
          have_node="$(node --version | tr -d v)"
          if [ "$(printf '%s\n%s\n' "$need_node" "$have_node" | sort -V | head -n1)" != "$need_node" ]; then
            echo "::error::Node $have_node is below $need_node, the floor for staged publishing"
            exit 1
          fi

      - name: Verify tag matches package, viewer and citation versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Was a hand-rolled node one-liner that re-derived the CalVer ->
          # semver normalisation and compared ONE representation. This PR's
          # point is one gate instead of four, so the npm job uses the same
          # shared check as publish.yml and the release preflight.
          python3 scripts/check_version_consistency.py --expect-tag "$GITHUB_REF_NAME"

      - name: Install dependencies
        working-directory: packages/luxar-viewer
        run: pnpm install --frozen-lockfile

      - name: Build library bundle + sanity-check (ci:release)
        working-directory: packages/luxar-viewer
        run: pnpm run ci:release

      - name: Inspect the tarball (dry-run pack)
        working-directory: packages/luxar-viewer
        run: npm pack --dry-run

      # Actual publish is gated on the repo variable ENABLE_NPM_PUBLISH so that
      # release tags don't produce a failing npm job before the npm account/org
      # and auth are set up. Flip it on (Settings -> Variables -> ENABLE_NPM_PUBLISH
      # = true) once the one-time setup in the header is done. Until then, tag
      # pushes still build + pack (validating the tarball) without publishing.
      - name: Stage the npm release (approval is manual — see the header)
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && vars.ENABLE_NPM_PUBLISH == 'true'
        working-directory: packages/luxar-viewer
        # STAGES, does not publish. Trusted publishers created after 2026-09-03
        # default to stage-only, so `npm publish` would fail on permissions —
        # and staging is npm's recommendation regardless, since it puts a 2FA
        # review in front of an irreversible publish.
        #
        # No --provenance/--access flags: package.json already sets
        # publishConfig.provenance=true and access=public, and duplicating them
        # on the command line means two places to keep in agreement.
        run: |
          set -euo pipefail
          npm stage publish
          echo "::notice::@luxar/viewer staged, NOT published. Approve it to make it installable:" \
               "npm stage list @luxar/viewer && npm stage approve <stage-id> (2FA required)."
        env:
          # Honored when present (token auth). Leave the secret unset once a
          # trusted publisher is configured and OIDC takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note — npm staging gated off
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && vars.ENABLE_NPM_PUBLISH != 'true'
        run: |
          echo "::notice::npm staging skipped (built + packed only). Set repo variable" \
               "ENABLE_NPM_PUBLISH=true after configuring npm auth (see workflow header)."
