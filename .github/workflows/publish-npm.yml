# Publish the Luxar Viewer library (@royerlab/luxar-viewer) to npm.
#
# Sibling of publish.yml (which ships the Python package to PyPI). Same trigger:
# pushing a version tag (e.g. `v2026.06.29`). The tag MUST match the `version`
# in packages/luxar-viewer/package.json (CalVer `YYYY.MM.DD`, zero-padded) or the
# job fails fast before publishing. Keep package.json's version in lockstep with
# the Python __version__ via `make set-version DATE=YYYY.MM.DD`.
#
# What gets published is the LIBRARY bundle built by `pnpm run ci:release`
# (build:lib -> dist/lib/** + a sanity check that `three` is externalized and the
# barrel is side-effect-free). This is independent of the standalone viewer app
# that `pnpm build` produces and that the Python wheel bundles.
#
# ── ONE-TIME npm-side setup (NOT done yet — do this at launch) ────────────────
# Target end-state: token-less OIDC trusted publishing with provenance, mirroring
# the PyPI setup in publish.yml. KEY GOTCHA: unlike PyPI, npm has no "pending
# publisher" — a trusted publisher can only be attached to a package that ALREADY
# exists, so the FIRST publish must bootstrap with a token (Step 2); OIDC takes
# over from the second release on (Steps 3-4).
#
#   1. ACCOUNT + ORG (once):
#      - Create an npm account (npmjs.com), enable 2FA (Account -> Two-Factor Auth).
#      - Create the free `royerlab` org (Add Organization -> Free plan). The scope
#        must exist before any `@royerlab/*` publish.
#
#   2. BOOTSTRAP THE FIRST PUBLISH (token, once — npm needs the package to exist
#      before a trusted publisher can be attached). Easiest locally:
#          npm login                       # browser auth + 2FA
#          cd packages/luxar-viewer
#          pnpm run ci:release              # builds dist/lib (sourcemap-free)
#          npm publish --access public      # creates @royerlab/luxar-viewer
#      (Or in CI: add a Granular Access Token as the `NPM_TOKEN` secret on the
#      `npm` environment — this workflow already wires NODE_AUTH_TOKEN to it —
#      set ENABLE_NPM_PUBLISH=true, and push a tag.)
#
#   3. CONFIGURE THE TRUSTED PUBLISHER (the OIDC part). On
#      npmjs.com/package/@royerlab/luxar-viewer -> Settings tab -> "Trusted
#      Publisher" -> GitHub Actions, enter EXACTLY:
#          Organization or user : royerlab
#          Repository           : luxar
#          Workflow filename    : publish-npm.yml
#          Environment          : npm        (optional but recommended)
#
#   4. SWITCH CI TO TOKEN-LESS + TURN IT ON:
#      - Create a GitHub environment named `npm` (Settings -> Environments),
#        ideally restricted to `v*` tags.
#      - DELETE the `NPM_TOKEN` secret — with the trusted publisher configured and
#        `id-token: write` present, `npm publish` mints a short-lived credential
#        via OIDC automatically (the empty NODE_AUTH_TOKEN below is harmless).
#      - Flip the repo variable `ENABLE_NPM_PUBLISH` to `true` (Settings ->
#        Secrets and variables -> Actions -> Variables). This is the master
#        switch: until it is `true`, tag pushes build + pack but DO NOT publish,
#        so a release never shows a failing npm job before npm is ready.
#
# Until Step 4 flips the switch, this workflow is a prepared template: tag pushes
# (and the workflow_dispatch dry-run) build + pack without publishing — no secrets
# required.
name: Publish viewer to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build + pack only; do not publish"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish-npm:
    name: Build + publish @royerlab/luxar-viewer
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@royerlab/luxar-viewer
    permissions:
      contents: read
      id-token: write # provenance attestation + (optional) OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust (for WASM build)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.14.0" # pinned to match ci.yml (deterministic, not 'latest')

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          # Read the viewer manifest's exact packageManager pin, matching CI,
          # docs, and PyPI publish. pnpm >=10.6 is required to read the security
          # overrides from the packages-less pnpm-workspace.yaml.
          package_json_file: packages/luxar-viewer/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      # `--provenance` and OIDC trusted publishing require a recent npm CLI.
      - name: Upgrade npm CLI
        run: npm install -g npm@latest

      - name: Verify tag matches viewer package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./packages/luxar-viewer/package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          # The tag is zero-padded CalVer (v2026.06.29) but package.json is semver
          # (no leading zeros: 2026.6.29). Normalize the tag the SAME way
          # `make set-version` (scripts/set_version.py) does before comparing.
          EXPECTED="$(node -e "console.log(process.argv[1].split('.').map(Number).join('.'))" "$TAG_VERSION")"
          echo "package.json version    = $PKG_VERSION"
          echo "tag normalized to semver = $EXPECTED   (from $GITHUB_REF_NAME)"
          if [ "$PKG_VERSION" != "$EXPECTED" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' (-> $EXPECTED) does not match viewer version '$PKG_VERSION'. Run 'make set-version DATE=YYYY.MM.DD' and re-tag."
            exit 1
          fi

      - name: Install dependencies
        working-directory: packages/luxar-viewer
        run: pnpm install --frozen-lockfile

      - name: Build library bundle + sanity-check (ci:release)
        working-directory: packages/luxar-viewer
        run: pnpm run ci:release

      - name: Inspect the tarball (dry-run pack)
        working-directory: packages/luxar-viewer
        run: npm pack --dry-run

      # Actual publish is gated on the repo variable ENABLE_NPM_PUBLISH so that
      # release tags don't produce a failing npm job before the npm account/org
      # and auth are set up. Flip it on (Settings -> Variables -> ENABLE_NPM_PUBLISH
      # = true) once the one-time setup in the header is done. Until then, tag
      # pushes still build + pack (validating the tarball) without publishing.
      - name: Publish to npm (provenance)
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && vars.ENABLE_NPM_PUBLISH == 'true'
        working-directory: packages/luxar-viewer
        run: npm publish --provenance --access public
        env:
          # Honored when present (token auth). Leave the secret unset once a
          # trusted publisher is configured and OIDC takes over.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note — npm publish gated off
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run && vars.ENABLE_NPM_PUBLISH != 'true'
        run: |
          echo "::notice::npm publish skipped (built + packed only). Set repo variable" \
               "ENABLE_NPM_PUBLISH=true after configuring npm auth (see workflow header)."
