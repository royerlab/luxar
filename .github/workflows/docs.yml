name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/luxar/src/luxar/**'
      - 'packages/luxar-viewer/src/**'
      - 'packages/luxar-viewer/typedoc.json'
      - 'packages/luxar-viewer/typedoc-warnings-baseline.json'
      - 'packages/luxar-viewer/scripts/check-overrides.mjs'
      - 'packages/luxar-viewer/scripts/check-typedoc-warnings.mjs'
      - 'packages/luxar-viewer/scripts/check-typedoc-warnings.test.mjs'
      - 'packages/luxar-viewer/package.json'
      - 'packages/luxar-viewer/tsconfig*.json'
      - 'scripts/check_documentation.py'
      - 'scripts/docs_baseline.json'
      - 'pyproject.toml'
      - 'packages/luxar-viewer/pnpm-lock.yaml'
      - 'packages/luxar-viewer/pnpm-workspace.yaml'
      - '.github/workflows/docs.yml'
  workflow_dispatch: # Allow manual trigger from Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python-docs
        with:
          python-version: '3.12'

      # Read the exact packageManager pin used by CI and both publish
      # workflows. This is load-bearing: the security pins are single-sourced
      # in pnpm-workspace.yaml, and reading `overrides` from that file needs
      # pnpm >=10.6. See `pnpm run check:overrides`.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Hatch
        run: pipx install --python "${{ steps.setup-python-docs.outputs.python-path }}" hatch

      - name: Check pnpm overrides are single-sourced
        run: node packages/luxar-viewer/scripts/check-overrides.mjs

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install --frozen-lockfile

      - name: Check documentation completeness ratchet
        run: hatch run docs:python scripts/check_documentation.py

      - name: Check TypeDoc warning ratchet
        run: |
          cd packages/luxar-viewer
          pnpm run test:typedoc-warnings
          pnpm run typedoc:check-warnings

      # Build Sphinx docs (Python API + guides + tutorials). The Hatch script
      # uses -W --keep-going, so every warning and broken internal reference is fatal.
      - name: Build Sphinx documentation
        run: hatch run docs:build

      # Build TypeDoc (TypeScript API) and copy into Sphinx output
      - name: Build TypeDoc documentation
        run: |
          set -euo pipefail
          cd packages/luxar-viewer && pnpm typedoc
          # Guard against a failed/empty typedoc run publishing a partial site.
          if [ -z "$(ls -A docs/api 2>/dev/null)" ]; then
            echo "::error::TypeDoc produced no output in docs/api — aborting."
            exit 1
          fi
          mkdir -p ../../docs/_build/html/api/viewer
          cp -r docs/api/* ../../docs/_build/html/api/viewer/

      # Upload docs as artifact for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
