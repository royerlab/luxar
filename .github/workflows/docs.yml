name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/luxar/src/luxar/**'
      - 'packages/luxar-viewer/src/**'
      - 'packages/luxar-viewer/typedoc.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch: # Allow manual trigger from Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Hatch
        run: pipx install hatch

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install --frozen-lockfile

      # Create stub viewer dist so editable install succeeds (force-include)
      - name: Create viewer dist stub
        run: mkdir -p packages/luxar-viewer/dist

      # Build Sphinx docs (Python API + guides + tutorials)
      - name: Build Sphinx documentation
        run: hatch run docs:build

      # Build TypeDoc (TypeScript API) and copy into Sphinx output
      - name: Build TypeDoc documentation
        run: |
          set -euo pipefail
          cd packages/luxar-viewer && pnpm typedoc
          # Guard against a failed/empty typedoc run publishing a partial site.
          if [ -z "$(ls -A docs/api 2>/dev/null)" ]; then
            echo "::error::TypeDoc produced no output in docs/api — aborting."
            exit 1
          fi
          mkdir -p ../../docs/_build/html/api/viewer
          cp -r docs/api/* ../../docs/_build/html/api/viewer/

      # Upload docs as artifact for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
