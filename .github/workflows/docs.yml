name: Deploy Documentation

on:
  workflow_dispatch: # Allow manual trigger from Actions UI
  schedule:
    # Publish daily instead of rebuilding on every main promotion. Use the
    # manual trigger above when documentation needs to go live immediately.
    - cron: '37 10 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # A newer publication run makes an older build obsolete, so do not
    # serialize paid runners behind stale work.
    concurrency:
      group: pages-build
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The workflow steps come from the current default branch, while the site
      # content comes from main so only promoted documentation is published.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Sphinx publishes these four LFS-tracked screenshots. Fetch them
      # explicitly instead of smudging every demo dataset and gallery asset in
      # the repository on each main promotion. The empty exclude neutralizes
      # any inherited lfs.fetchexclude so the include list is authoritative.
      - name: Fetch documentation LFS assets
        run: git lfs pull --include="docs/images/docs/basic-3d-pointcloud.png,docs/images/docs/gsplats-scene.png,docs/images/docs/nd-navigation-sliders.png,docs/images/docs/viewer-ui-overview.png" --exclude=""

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python-docs
        with:
          python-version: '3.12'

      # Read the exact packageManager pin used by CI and both publish
      # workflows. This is load-bearing: the security pins are single-sourced
      # in pnpm-workspace.yaml, and reading `overrides` from that file needs
      # pnpm >=10.6. See `pnpm run check:overrides`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Hatch
        run: pipx install --python "${{ steps.setup-python-docs.outputs.python-path }}" hatch

      - name: Check pnpm overrides are single-sourced
        run: node packages/luxar-viewer/scripts/check-overrides.mjs

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install --frozen-lockfile

      - name: Check documentation completeness ratchet
        run: hatch run docs:python scripts/check_documentation.py

      - name: Check TypeDoc warning ratchet
        run: |
          cd packages/luxar-viewer
          pnpm run test:typedoc-warnings
          pnpm run typedoc:check-warnings

      # Build Sphinx docs (Python API + guides + tutorials). The Hatch script
      # uses -W --keep-going, so every warning and broken internal reference is fatal.
      - name: Build Sphinx documentation
        run: hatch run docs:build

      - name: Reject unresolved LFS pointers
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for directory in docs/_build/html/_images docs/_build/html/_downloads; do
            [ -d "$directory" ] || continue
            while IFS= read -r -d '' path; do
              if [ "$(head -n 1 "$path")" = "version https://git-lfs.github.com/spec/v1" ]; then
                echo "::error file=$path::Git LFS pointer would be published"
                found=true
              fi
            done < <(find "$directory" -type f -print0)
          done
          if [ "$found" = true ]; then
            exit 1
          fi

      # Build TypeDoc (TypeScript API) and copy into Sphinx output
      - name: Build TypeDoc documentation
        run: |
          set -euo pipefail
          cd packages/luxar-viewer && pnpm typedoc
          # Guard against a failed/empty typedoc run publishing a partial site.
          if [ -z "$(ls -A docs/api 2>/dev/null)" ]; then
            echo "::error::TypeDoc produced no output in docs/api — aborting."
            exit 1
          fi
          mkdir -p ../../docs/_build/html/api/viewer
          cp -r docs/api/* ../../docs/_build/html/api/viewer/

      # Upload docs as artifact for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    # Never interrupt an in-flight production deployment.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
