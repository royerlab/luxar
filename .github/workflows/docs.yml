name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/luxar/src/luxar/**'
      - 'packages/luxar-viewer/src/**'
      - 'packages/luxar-viewer/typedoc.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch: # Allow manual trigger from Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Pin pnpm to match ci.yml — version 10 still reads the `pnpm.overrides`
      # field in package.json. An unpinned `npm install -g pnpm` pulls a newer
      # pnpm that ignores that field, so `pnpm install --frozen-lockfile` aborts
      # with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH (the overrides recorded in the
      # lockfile no longer match the now-unread config).
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10

      - name: Install Hatch
        run: pipx install hatch

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install --frozen-lockfile

      # Create stub viewer dist so editable install succeeds (force-include)
      - name: Create viewer dist stub
        run: mkdir -p packages/luxar-viewer/dist

      # Build Sphinx docs (Python API + guides + tutorials)
      - name: Build Sphinx documentation
        run: hatch run docs:build

      # Build TypeDoc (TypeScript API) and copy into Sphinx output
      - name: Build TypeDoc documentation
        run: |
          set -euo pipefail
          cd packages/luxar-viewer && pnpm typedoc
          # Guard against a failed/empty typedoc run publishing a partial site.
          if [ -z "$(ls -A docs/api 2>/dev/null)" ]; then
            echo "::error::TypeDoc produced no output in docs/api — aborting."
            exit 1
          fi
          mkdir -p ../../docs/_build/html/api/viewer
          cp -r docs/api/* ../../docs/_build/html/api/viewer/

      # Upload docs as artifact for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
