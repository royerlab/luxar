name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'packages/luxar/src/luxar/**'
      - 'packages/luxar-viewer/src/**'
      - 'packages/luxar-viewer/typedoc.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch: # Allow manual trigger from Actions UI

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Hatch
        run: pipx install hatch

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install

      # Build Sphinx docs (Python API + guides + tutorials)
      - name: Build Sphinx documentation
        run: hatch run docs:build

      # Build TypeDoc (TypeScript API) and copy into Sphinx output
      - name: Build TypeDoc documentation
        run: |
          cd packages/luxar-viewer && pnpm typedoc
          mkdir -p ../../docs/_build/html/api/viewer
          cp -r docs/api/* ../../docs/_build/html/api/viewer/

      # Upload docs as artifact for GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
