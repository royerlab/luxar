name: CI queue redispatch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      target_run_id:
        description: Original CI run waiting for cancellation before full rerun
        required: false
        type: string

concurrency:
  group: ci-queue-redispatch-${{ inputs.target_run_id || 'scan' }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  redispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Find one run stranded behind saturated obsidian
        if: inputs.target_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_QUEUE_RESIDENCY_MINUTES: ${{ vars.LUXAR_CI_MAX_QUEUE_RESIDENCY_MINUTES }}
        run: |
          minutes=${MAX_QUEUE_RESIDENCY_MINUTES:-30}
          if ! echo "$minutes" | grep -qE '^[1-9][0-9]*$'; then minutes=30; fi
          queued_before=$(( $(date +%s) - minutes * 60 ))
          python3 scripts/ci_queue_redispatch.py scan \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --queued-before "$queued_before" \
            --max-runs 100

      - name: Finish cancellation and rerun the complete workflow
        if: inputs.target_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci_queue_redispatch.py finish \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ inputs.target_run_id }}"
