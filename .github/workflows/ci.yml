name: CI

on:
  push:
    # This relies on `main` staying FAST-FORWARD-ONLY from `dev` (see the promotion
    # daemons): every commit main receives has already run this whole workflow on
    # its dev push and carries the passing statuses on the very same SHA. A main
    # push would only re-run the identical suite on the identical commit. Branch
    # protection is still satisfied by those carried statuses (that is how
    # promote-ff already fast-forwards), and the deploy/publish workflows keep
    # their own main triggers. A commit that exists only on main gets NO CI here.
    # So test on dev, not twice. (#cost)
    branches: [dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # A merge reaches dev about every 39 minutes while the required Python and
    # TypeScript legs take considerably longer, so most push runs are cancelled by
    # the next merge before they can produce a promotable commit. Schedule events
    # have their own concurrency group, so dev merges cannot cancel them. Run one
    # every three hours to supply deliberate green windows for promotion.
    #
    # Scheduled runs still share a group with EACH OTHER, so a window still in
    # flight three hours later is cancelled by its successor -- which is itself a
    # promotion window, so a lost window costs three hours, not the cadence.
    # UNLOADED, a floor-only window is one Python leg beside `typescript-tests`,
    # ~83-91 min against the 180 min of spacing (see the `timeout-minutes` note on
    # `python-tests`); the 09:17 full-matrix window is three legs at
    # `max-parallel: 2`, so two waves, ~166-182 min plus the hosted `changes` /
    # `pick-runner` preamble -- AT the spacing rather than under it. Both figures
    # are unloaded, and obsidian is deliberately SCHED_IDLE, so neither window is
    # guaranteed to finish: the full-matrix one is simply the first to lose, and
    # its 3.13/3.14 coverage then waits for the next day. A floor-only window
    # needs about half as much quiet and is therefore the last to be lost;
    # sustained contention at the documented 2.4-3.3x stretch can cancel both
    # until the box quiets.
    #
    # Scheduled runs select the whole suite because they have no PR base. Keep the
    # 09:17 UTC window on the full supported Python matrix so 3.13/3.14 have one
    # dedicated daily window; the other seven use only the required 3.12 context.
    # Every window consumes hosted minutes for its short jobs, but the long
    # Python/TypeScript legs always join the obsidian queue. Sustained contention
    # can therefore cancel successive promotion windows. During an extended
    # outage or promotion stall, create/set the Actions repository variable
    # LUXAR_CI_FORCE_HOSTED to 1 before the next window, then clear it after
    # capacity recovers.
    #
    # DEFAULT-BRANCH DEPENDENCE. GitHub runs `schedule:` triggers only on the
    # repository DEFAULT branch, at its tip. While `dev` is the default the event
    # SHA is dev's tip at dispatch, and every suite checkout is pinned to that exact
    # event SHA so the contexts attest the tree they test. The repair walk also
    # resolves dev explicitly. After the default flips to main, however, the event
    # SHA and scheduled checkouts both point at main; #2466 tracks replacing this
    # cron trigger before that flip so promotion windows still run against dev.
    - cron: '17 9 * * *'
    - cron: '17 0,3,6,12,15,18,21 * * *'

concurrency:
  # `github.event_name` is in the key ONLY to keep scheduled and push-to-dev
  # in separate groups. While `dev` was the repository default a scheduled run's
  # ref was `refs/heads/dev`, the same as a merge's; once the default flips to
  # `main` a scheduled run's ref becomes `refs/heads/main`. This group is LEFT
  # KEYED ON `github.ref` DELIBERATELY (considered, no change made): it only has
  # to be STABLE and to keep the two event kinds apart, and `github.event_name`
  # already does the separating -- a `push` fires only on `dev` and a
  # `pull_request` never carries the `schedule` event, so no push or PR run ever
  # shares a scheduled run's group regardless of ref, and scheduled runs still
  # coalesce with each other post-flip (all `...-schedule-refs/heads/main-...`).
  # Keying it on a pinned `refs/heads/dev` would only rename the group without
  # changing behaviour, so it stays as-is; the scheduled suite jobs test one
  # captured dev SHA via their checkout pins, not via this group. Under one
  # shared group whichever of the two starts SECOND cancels the other -- and they
  # collide constantly: over the 31 days before this was written a merge landed
  # inside the daily cron's ~30min window on 17 days, and inside the half hour
  # before it on 12.
  #
  # The expensive direction is the cron killing a merge's push run: a push run
  # has no PR base either, so like a scheduled run it selects the WHOLE suite,
  # and it is the only place the new `dev` commit gets that treatment. A cron has
  # no business discarding it. The reverse is milder -- a merge that cancels the
  # scheduled run executes the full suite itself -- but it still leaves "did
  # every required job pass today?" unanswerable at a glance.
  #
  # Fresh runs all use the `fresh` suffix, so PR and push runs still coalesce by
  # event and ref exactly as before. Reruns use the original run id instead, so
  # a newer fresh run does not cancel them and backlog repairs for different dev
  # commits do not cancel each other. A later attempt of the SAME run now
  # supersedes its earlier attempt because both carry the same run id; the old
  # attempt-number key kept those attempts in separate groups.
  # Neither rerun path restarts queue-watchdog. An obsidian-routed job left
  # undispatched after its runners disappear can remain queued until GitHub's
  # 24-hour ceiling; one dispatched before its slot recycles can instead reach
  # its timeout before any step starts or runner name is recorded.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ github.run_attempt == 1 && 'fresh' || github.run_id }}
  cancel-in-progress: true

# Least privilege: these jobs only check out and test. Override per-job if a
# future job needs to write (releases, PR comments, etc.).
permissions:
  contents: read

jobs:
  # Change detection emits two kinds of output:
  # - dom_py / dom_ts / dom_rust / dom_go: which language domains the diff
  #   touches. Each job runs its heavy steps only for the domain(s) it covers,
  #   so a change confined to one language does not pay for the others, and a
  #   docs/Markdown-only change touches no domain and runs no suite at all.
  # - docs_relevant: docs, documented Python/TypeScript source, or gate config
  #   runs the dedicated documentation-quality checks.
  #
  # Heavy jobs still RUN when their domain is untouched (checkout + skipped
  # steps), so every required context reports green rather than relying on grey
  # "skipped" semantics. The docs-quality job follows the same rule when
  # docs_relevant is false. A push to dev has no PR base, so it runs both full
  # CI and docs checks.
  #
  # FAIL-SAFE: every dependent job carries `if: ${{ !cancelled() }}`. Without
  # it, a failure of THIS job (flaky checkout, runner outage) would skip the
  # dependents, and skipped checks count as passing — i.e. the gate would fail
  # OPEN with no CI at all. With the guard the dependents still run and every
  # output reads EMPTY, which is why each condition below is written
  # `!= 'false'`: an empty value selects the full suite, and only an explicit
  # `false` skips. Never write these as `== 'true'` — that inverts the
  # fail-safe, so a broken `changes` job would produce an all-green run with no
  # CI behind it.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dev_sha: ${{ steps.scheduled-dev.outputs.dev_sha }}
      docs_relevant: ${{ steps.filter.outputs.docs_relevant }}
      dom_py: ${{ steps.filter.outputs.dom_py }}
      dom_ts: ${{ steps.filter.outputs.dom_ts }}
      dom_rust: ${{ steps.filter.outputs.dom_rust }}
      dom_go: ${{ steps.filter.outputs.dom_go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # While dev is the default, the scheduled event SHA is dev's immutable
          # tip at dispatch. Empty on push/PR == default.
          ref: ${{ github.event_name == 'schedule' && github.sha || '' }}
          fetch-depth: 0
      - id: scheduled-dev
        if: github.event_name == 'schedule'
        name: Capture the scheduled dev commit
        run: echo "dev_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: filter
        name: Classify the diff (language domains + documentation relevance)
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          if [ -z "$base" ]; then
            echo "push event (no PR base) -> full CI + documentation checks"
            echo "docs_relevant=true" >> "$GITHUB_OUTPUT"
            printf "dom_py=true\ndom_ts=true\ndom_rust=true\ndom_go=true\n" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q origin "$base" 2>/dev/null || true
          changed="$(git diff --no-renames --name-only "$base"...HEAD)"
          deleted="$(git diff --no-renames --diff-filter=D --name-only "$base"...HEAD)"
          echo "--- changed files ---"; printf '%s\n' "$changed"
          echo "--- deleted files ---"; printf '%s\n' "$deleted"

          # DOMAIN classification: a domain's CI runs only if a file in that domain
          # changed. Fail-safe: an empty change list -> all true. A domain nobody
          # touched skips its steps, and the job still reports its required context
          # green (no wedge).
          #
          # The classifier must name every INPUT of a gated check, not just the
          # obvious source extensions — a check whose own inputs are unclassified
          # is a check that skips for exactly the change it exists to catch.
          dom_py=false; dom_ts=false; dom_rust=false; dom_go=false
          if [ -z "$changed" ]; then
            dom_py=true; dom_ts=true; dom_rust=true; dom_go=true
          else
            # python-tests also hosts the CROSS-LANGUAGE gates, so dom_py owns their
            # non-Python inputs: format-contract/contract.yaml and the generated TS
            # half (`check-contract`), the viewer package.json version (version
            # consistency), the demos/data tree + its manifest
            # (`check-data-manifest`), and the non-Python entry points guarded by
            # test_fixture_environment.py. None carries a Python extension.
            # Same reason for the non-.py files the pytest suite itself READS,
            # each an input of a test that would otherwise skip:
            # scripts/complexity_baseline.json (the C901 ratchet's only non-.py
            # input — unclassified, a baseline-only diff went green in 7s without
            # checking the baseline still MATCHES the tree, #1678),
            # scripts/lint_baseline.json (the same for the bugbear/RUF012 ratchet:
            # editing it is exactly how someone would silence real debt, so the
            # edit must run the test that re-derives it), the Makefile
            # (test_python_version_declarations.py, test_demo_commands.py),
            # scripts/gallery/manifest.json (test_demo_meta.py cross-validates it
            # against the demo registry), benchmark_bisect.sh (executed directly
            # by test_benchmark_bisect.py), demo_archive_characteristics.json
            # (checked against the hosted demo recipe), scripts/release.sh
            # (test_set_version.py asserts its `make set-version` remedy string;
            # a shell file matches no other domain, so a release.sh-only diff
            # would otherwise run zero tests), generate-gallery.spec.ts (the
            # gallery manifest field contract is parsed from it),
            # docs/guides/user/CLI_REFERENCE.md (test_docs_command_coverage.py),
            # the root and demos README files (test_readme_demo_docs.py,
            # test_demo_import_spelling.py), plus the CLAUDE.md and visualization-
            # skill projections checked by sync_demo_counts.py. The Cholesky
            # documentation guard reads that same CLAUDE.md, all three skill pages
            # and GSPLATS_DIMENSION_MAPPING.md.
            # GATE_INPUTS in test_ci_diff_classifier.py is the declaration checked
            # against this ERE. Markdown alone runs only docs-quality, so these need
            # explicit Python ownership.
            # Python contract tests also parse a narrow set of viewer TypeScript
            # sources through viewer_source(); that same classifier test scans the
            # literal calls and requires a GATE_INPUTS row for each. Name those files,
            # not whole viewer subtrees: unrelated viewer edits should remain
            # TypeScript-only and avoid the Python matrix.
            # test_docs_workflow.py also parses docs.yml and derives the published
            # LFS candidate set from .gitattributes, so both are Python gate inputs.
            # external-reference-audits.yml is one too: its schedule, permissions
            # and token wiring are asserted by test_run_external_reference_audits.py,
            # and a workflow file matches no other domain on its own.
            printf '%s\n' "$changed" | grep -qE '(\.py$|^Makefile$|^README\.md$|^CLAUDE\.md$|^CITATION\.cff$|^\.agents/skills/luxar-(gsplat-pipeline/SKILL|visualization/(SKILL|references/scene-api))\.md$|^pyproject\.toml$|^\.pre-commit-config\.yaml$|\.(pyx|pxd|cu|cuh|cpp|h|hpp|mm|metal)$|^\.gitattributes$|^scripts/complexity_baseline\.json$|^scripts/lint_baseline\.json$|^scripts/gallery/manifest\.json$|^scripts/benchmarks/benchmark_bisect\.sh$|^scripts/demo_archive_characteristics\.json$|^scripts/release\.sh$|^docs/(guides/user/CLI_REFERENCE|specs/GSPLATS_DIMENSION_MAPPING)\.md$|^format-contract/|^\.github/workflows/(docs|external-reference-audits)\.yml$|^packages/luxar/src/luxar/demos/(README\.md$|data)|^packages/luxar-viewer/(package\.json$|src/(config/sections/(camera|rendering-controls)/data\.ts$|data/(attrs-composer\.ts$|loaders/spatial-query/tolerance-computer\.ts$)|rendering/(blending-state\.ts$|element-texture-layout\.ts$|materials/mesh/appearance\.ts$|node-factory/create-(points|lines|gsplats|mesh)-node\.ts$)|scene/lod-group-registry\.ts$|tests/(global-setup\.ts$|README\.md$|screenshots/exposure-policy\.ts$|screenshots/generate-gallery\.spec\.ts$)|types/(data-monitor-types|format-contract|geometry-capabilities|line-join|lod-group|partition-group)\.ts$)|tests/fixtures/README\.md$|tools/example-fixture-freshness\.ts$))' && dom_py=true || true
            # TS domain = the WHOLE viewer package (its py fixture-generators feed TS tests -> hierarchy) + root TS config.
            # The gallery-selection unit test also reads the root README and gallery manifest.
            printf '%s\n' "$changed" | grep -qE '(^packages/luxar-viewer/|^README\.md$|^scripts/gallery/manifest\.json$|^tsconfig[^/]*\.json$|(^|/)vitest[^/]*\.(ts|js|mjs)$)' && dom_ts=true || true
            printf '%s\n' "$changed" | grep -qE '(\.rs$|^wasm/|(^|/)Cargo\.(toml|lock)$)' && dom_rust=true || true
            printf '%s\n' "$changed" | grep -qE '(\.go$|^packages/luxar/src/luxar/cli/_launchers/|(^|/)go\.(mod|sum)$)' && dom_go=true || true
            # This workflow DEFINES how every suite is invoked, so it belongs to all
            # four domains: an edit that breaks a step's command, condition or setup
            # has to be caught by the run that contains it, not by the next unrelated
            # PR in that language.
            if printf '%s\n' "$changed" | grep -qE '^\.github/workflows/ci\.yml$'; then
              dom_py=true; dom_ts=true; dom_rust=true; dom_go=true
            fi
          fi
          echo "-> domains: py=$dom_py ts=$dom_ts rust=$dom_rust go=$dom_go"
          printf "dom_py=%s\ndom_ts=%s\ndom_rust=%s\ndom_go=%s\n" "$dom_py" "$dom_ts" "$dom_rust" "$dom_go" >> "$GITHUB_OUTPUT"

          # Run the documentation gate for published docs, documented source,
          # checker/baseline changes, and the build/workflow files that define
          # the gate. Any deletion also runs it because package READMEs may name
          # tracked files of any type; --no-renames makes a rename include a
          # deletion. Empty change output is treated as relevant (fail-safe).
          docs_pattern='(^docs/|\.[Mm][Dd]$|\.[Rr][Ss][Tt]$|^packages/luxar/src/luxar/.*\.py$|^packages/luxar-viewer/src/.*\.(ts|tsx)$|^scripts/(check_documentation\.py|docs_baseline\.json)$|^packages/luxar-viewer/(package\.json|typedoc\.json|typedoc-warnings-baseline\.json|tsconfig[^/]*\.json|scripts/(check-overrides\.mjs|check-typedoc-warnings(-tests)?\.mjs))$|^packages/luxar-viewer/pnpm-(lock|workspace)\.yaml$|^pyproject\.toml$|^Makefile$|^\.github/workflows/(ci|docs)\.yml$)'
          if [ -z "$changed" ] || [ -n "$deleted" ] || printf '%s\n' "$changed" | grep -qE "$docs_pattern"; then
            echo "-> documentation-relevant changes: RUN docs-quality"
            echo "docs_relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no documentation-relevant changes: docs-quality will report a no-op success"
            echo "docs_relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # Runner routing: forks and the explicit LUXAR_CI_FORCE_HOSTED=1 break-glass
  # use GitHub-hosted runners; every other run uses the self-hosted `obsidian`
  # label. There is no automatic capacity, backlog, schedule, or rerun fallback.
  # This selector MUST itself run on ubuntu-latest so fork safety and the manual
  # override still work while obsidian is unavailable.
  # The runner/container machinery lives in royerlab/luxar-ci; nothing here can
  # use the `obsidian` label unless that kit is deployed and healthy.
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      label: ${{ steps.guard.outputs.label || steps.route.outputs.label || 'ubuntu-latest' }}
    steps:
      - id: guard
        name: Keep fork code and forced-hosted runs off obsidian
        env:
          FORCE_HOSTED: ${{ vars.LUXAR_CI_FORCE_HOSTED }}
          # Empty on push events; the `|| github.repository` makes those read
          # as same-repo, which they are.
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          # Fork PRs never route to the self-hosted box. Today this is
          # belt-and-braces — the repo is private, so only
          # collaborators can open PRs at all — but the routing must stay safe
          # if the repo ever goes public: per GitHub's own hardening guidance,
          # a self-hosted runner must not execute code from arbitrary forks.
          if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "PR head is a fork ($HEAD_REPO) -> routing to ubuntu-latest"
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$FORCE_HOSTED" = "1" ]; then
            echo "LUXAR_CI_FORCE_HOSTED=1 -> routing to ubuntu-latest"
            echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi

      - id: route
        name: Route same-repo runs to obsidian
        if: steps.guard.outputs.label == ''
        run: |
          echo "same-repo run -> obsidian only (no automatic paid fallback)"
          echo "label=obsidian" >> "$GITHUB_OUTPUT"

  # Runner selection deliberately does not inspect obsidian liveness. GitHub
  # never re-evaluates `runs-on` — a job assigned to the `obsidian`
  # label whose runners then vanish does not fall back. If it is never dispatched,
  # it can remain queued until GitHub's 24-hour ceiling; job-level timeout has not
  # started. If it was dispatched before its slot recycled, the timeout can run
  # with no steps or runner name recorded and eventually cancel the required leg.
  # This job covers the first 10 minutes from the hosted side: while any
  # obsidian-routed job is still queued, it checks in-progress obsidian jobs across
  # repository runs. If none are visible it cancels the run.
  # The workflow token cannot read repository-variable updates, so the publisher
  # is unavailable here; a stale GitHub `in_progress` state can therefore keep a
  # dead runner covered. A box that dies after this window can still leave an
  # undispatched leg queued until the 24-hour ceiling, or a dispatch-lost leg
  # running down its timeout. To recover, create/set the Actions repository
  # variable LUXAR_CI_FORCE_HOSTED to 1 and re-run all jobs; "Re-run failed"
  # reuses the previous router output. Clear the override after obsidian capacity
  # recovers.
  #
  # On a push or the daily full-matrix schedule, max-parallel deliberately holds
  # one Python leg queued while two Python legs and TypeScript occupy the three
  # slots. GitHub reports that held leg as `queued` with the `obsidian` label
  # (observed 2026-08-24). The current run's active obsidian jobs keep the held
  # leg covered. When this run is wholly queued, a periodic repository-wide scan
  # looks for work on other runs. Two scans with no active obsidian work are
  # required before cancellation.
  # The watchdog fails plumbing errors toward NOT cancelling.
  queue-watchdog:
    needs: [pick-runner]
    if: needs.pick-runner.outputs.label == 'obsidian'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      # The scanner is repository code, so checkout needs read-only contents.
      # Credentials stay disabled; only scripts/ is materialised.
      contents: read
    steps:
      # The job-level guard inherits pick-runner's fork check, so this checkout
      # never materialises a fork's merge ref in the actions:write job.
      - id: scanner-checkout
        name: Check out the stdlib queue scanner
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs materialise dev's scanner (see the schedule note).
          # Empty on push/PR == default.
          ref: ${{ github.event_name == 'schedule' && 'refs/heads/dev' || '' }}
          persist-credentials: false
          sparse-checkout: scripts

      - name: Leave the run alone if the queue scanner cannot be checked out
        if: steps.scanner-checkout.outcome != 'success'
        run: echo "queue scanner checkout failed; not cancelling on a plumbing failure"

      - name: Cancel the run if obsidian dies while jobs are still queued
        if: steps.scanner-checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Self-bounded below the job timeout. If jobs are STILL queued when
          # the window closes but obsidian stayed live the whole time, the box is
          # busy, not dead (a push or daily full-matrix schedule routes 4 test
          # jobs to obsidian, while a PR or frequent schedule routes 2;
          # overlapping event groups do not cancel one another, so queued work
          # can be healthy and draining) — leave the run alone.
          start=$(date +%s)
          end=$(( start + 10 * 60 ))
          materialize_end=$(( start + 3 * 60 ))
          seen_obsidian=0
          liveness_poll=0
          no_activity_checks=0
          while true; do
            now=$(date +%s)
            if [ "$now" -ge "$end" ]; then break; fi
            jobs=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100") \
              || jobs=__api_error__
            if [ "$jobs" = "__api_error__" ]; then
              no_activity_checks=0
              echo "jobs API read failed; retrying"
              sleep 30; continue
            fi
            classified=$(echo "$jobs" | python3 scripts/ci_queue_scan.py classify) \
              || classified='{"error":{"scope":"helper"}}'
            classify_error=$(echo "$classified" | jq -r '.error.scope // empty' 2>/dev/null) || classify_error=helper
            if [ -n "$classify_error" ]; then
              no_activity_checks=0
              echo "jobs API response was not parseable; retrying"
              sleep 30; continue
            fi
            visible=$(echo "$classified" | jq '.visible | length') \
              || { no_activity_checks=0; echo "job classification failed; retrying"; sleep 30; continue; }
            queued=$(echo "$classified" | jq -r '.queued | join(", ")') \
              || { no_activity_checks=0; echo "job classification failed; retrying"; sleep 30; continue; }
            running=$(echo "$classified" | jq -r '.running | join(", ")') \
              || { no_activity_checks=0; echo "job classification failed; retrying"; sleep 30; continue; }
            fanout_pending=$(echo "$jobs" | jq -r '[.jobs[] | select(.name == "changes")
                                                            | select(.status == "queued" or .status == "in_progress")
                                                            | .name] | join(", ")') \
              || { no_activity_checks=0; echo "fan-out job selection failed; retrying"; sleep 30; continue; }
            if [ "$visible" -gt 0 ]; then seen_obsidian=1; fi
            if [ -z "$queued" ]; then
              if [ "$seen_obsidian" -eq 1 ]; then
                echo "every obsidian-routed job has been picked up — done"
                exit 0
              fi
              if [ -n "$fanout_pending" ]; then
                materialize_end=$(( now + 3 * 60 ))
                echo "obsidian-routed jobs are waiting on run fan-out ($fanout_pending); retrying"
                sleep 30; continue
              fi
              if [ "$now" -ge "$materialize_end" ]; then
                echo "obsidian-routed jobs did not appear during the startup grace — done"
                exit 0
              fi
              # The jobs API can lag the newly eligible matrix after pick-runner.
              echo "obsidian-routed jobs are not visible yet; retrying"
              sleep 30; continue
            fi
            if [ -n "$running" ]; then
              no_activity_checks=0
              echo "this run has active obsidian jobs ($running); still queued: $queued"
              sleep 30; continue
            fi
            liveness_poll=$(( liveness_poll + 1 ))
            if [ $(( liveness_poll % 3 )) -ne 0 ]; then
              echo "waiting for the next repository liveness scan; still queued: $queued"
              sleep 30; continue
            fi
            liveness=$(python3 scripts/ci_queue_scan.py scan \
              --repository "$GITHUB_REPOSITORY" \
              --status in_progress \
              --max-runs 100 \
              --exclude-run "$GITHUB_RUN_ID" \
              --stop-after-running 1) \
              || liveness='{"error":{"scope":"helper"}}'
            liveness_error=$(echo "$liveness" | jq -r '.error.scope // empty' 2>/dev/null) || liveness_error=helper
            if [ "$liveness_error" = "runs" ] || [ "$liveness_error" = "helper" ]; then
              no_activity_checks=0
              echo "run liveness unreadable; not cancelling on a fluke — retrying"
              sleep 30; continue
            fi
            if [ "$liveness_error" = "jobs" ]; then
              no_activity_checks=0
              echo "job liveness unreadable; not cancelling on a fluke — retrying"
              sleep 30; continue
            fi
            # This liveness scan deliberately ignores truncation: it only needs
            # one active obsidian job to prove the box is still making progress.
            other_running=$(echo "$liveness" | jq -r '.running | join(", ")')
            if [ -n "$other_running" ]; then
              no_activity_checks=0
              echo "other runs have active obsidian jobs ($other_running); still queued: $queued"
              sleep 30; continue
            fi
            no_activity_checks=$(( no_activity_checks + 1 ))
            if [ "$no_activity_checks" -lt 2 ]; then
              echo "no active obsidian jobs found; requiring a second consecutive check before cancellation"
              sleep 30; continue
            fi
            echo "::error::obsidian has no active jobs on two consecutive checks with jobs still queued ($queued) — cancelling the run; create/set the Actions repository variable LUXAR_CI_FORCE_HOSTED to 1 (Settings > Secrets and variables > Actions > Variables), re-run all jobs, then clear it after capacity recovers"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
            # The cancel sweeps this job too; don't fall through to success
            # while it lands.
            sleep 120
            exit 1
          done
          if [ "$seen_obsidian" -eq 1 ]; then
            echo "watchdog window over; GitHub still reports active obsidian work — leaving the run alone"
          else
            echo "watchdog window over before obsidian-routed jobs appeared — leaving the run alone"
          fi

  docs-quality:
    needs: changes
    # Always report a stable check context. If change detection fails, its output
    # is empty and every `!= 'false'` condition below runs the full gate.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - name: No documentation-relevant changes
        if: needs.changes.outputs.docs_relevant == 'false'
        run: echo "No documentation-relevant changes; required check reports success."

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python-docs
        if: needs.changes.outputs.docs_relevant != 'false'
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: needs.changes.outputs.docs_relevant != 'false'
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: needs.changes.outputs.docs_relevant != 'false'
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Hatch
        if: needs.changes.outputs.docs_relevant != 'false'
        run: pipx install --python "${{ steps.setup-python-docs.outputs.python-path }}" hatch

      - name: Check pnpm overrides are single-sourced
        if: needs.changes.outputs.docs_relevant != 'false'
        run: node packages/luxar-viewer/scripts/check-overrides.mjs

      - name: Install viewer dependencies
        if: needs.changes.outputs.docs_relevant != 'false'
        run: cd packages/luxar-viewer && pnpm install --frozen-lockfile

      - name: Check README, docstring, and JSDoc completeness ratchet
        if: needs.changes.outputs.docs_relevant != 'false'
        run: hatch run docs:python scripts/check_documentation.py

      - name: Check TypeDoc warning ratchet
        if: needs.changes.outputs.docs_relevant != 'false'
        run: |
          cd packages/luxar-viewer
          pnpm run test:typedoc-warnings
          pnpm run typedoc:check-warnings

      - name: Build warning-fatal Sphinx documentation
        if: needs.changes.outputs.docs_relevant != 'false'
        run: hatch run docs:build

  python-tests:
    needs: [changes, pick-runner]
    # Fail-safe fallback to full CI if `changes` fails — see the note on the
    # `changes` job.
    if: ${{ !cancelled() }}
    # `|| 'ubuntu-latest'` keeps the same fail-open posture as the `changes` gate:
    # if pick-runner itself dies the output is empty, and an empty `runs-on` is a
    # workflow-level error rather than a fallback.
    runs-on: ${{ needs.pick-runner.outputs.label || 'ubuntu-latest' }}
    # `hatch run test-cov` runs `pytest -m 'not slow'` — the heavy CPU-fitting
    # tests (content-fit CLI, tiled/progressive fitting) are marked `slow` and
    # excluded here, cutting the serial 1-core run from >60 min to ~15 min while
    # coverage stays above the 89% gate (slow tests' code is redundantly
    # covered by fast unit tests). The FULL suite (incl. slow) is the local
    # pre-push gate (`hatch run test`).
    #
    # The suite runs under pytest-xdist ON THE SELF-HOSTED BOX ONLY (see
    # PYTEST_ADDOPTS below; hosted runners stay serial). The old note
    # here said xdist "doesn't help on the 1-core runner" — true of a 2-core
    # GitHub VM, and false on the 16-core self-hosted box, where the original
    # `-n 4` benchmark cut each leg from ~45 min to ~16. Combined with the thread
    # pinning below; neither works without the other. The memory-safe `-n 2`
    # runner-equivalent coverage runs took 1:16:49-1:25:17 under the runner's
    # CPU and memory limits.
    #
    # 180, not 60, because the self-hosted runners are deliberately SCHED_IDLE
    # (see luxar-ci-slot@.service): CI only gets CPU nobody else on that box
    # wants, so a sustained burst from the other workloads there can stretch a
    # leg arbitrarily. That is starvation, not a hang, and the router
    # deliberately does not redirect it — an idle-priority job is perfectly
    # healthy, just slow. A
    # timeout here would be a self-inflicted red. Including the ~5.5 min outside
    # the coverage step, the capped runs imply ~83-91 min jobs before contention;
    # completed obsidian legs have stretched 2.4-3.3x over their unloaded time.
    timeout-minutes: 180
    strategy:
      # Report every interpreter's verdict in one run: fail-fast would cancel the
      # siblings on the first red leg, losing precisely the per-version information
      # you need when the legs genuinely differ.
      fail-fast: false
      # With the obsidian fleet size documented by queue-watchdog, keep one
      # slot from being monopolised by one run's Python matrix. The shared
      # repository queue may still put other work ahead of this run's
      # `typescript-tests`; pushes and the daily full-matrix schedule execute two
      # Python legs, then the third. PRs and the seven floor-only scheduled
      # windows have one Python leg and are unaffected. Keep the GitHub-hosted
      # fork/override branch elastic: its matrix legs run on separate VMs.
      max-parallel: ${{ needs.pick-runner.outputs.label == 'obsidian' && 2 || 3 }}
      matrix:
        # FLOOR on every event, floor + NEWEST on push-to-dev and the daily
        # 09:17 UTC schedule.
        #
        # 3.12 is the floor (`requires-python = ">=3.12"`, what zarr 3.2+ needs)
        # and is the required status context under branch protection, so it runs
        # everywhere. But `>=3.12` has no ceiling: 3.13 and 3.14 are supported, the
        # `install-hatch` bootstrap explicitly prefers them, and a developer's
        # `hatch env` picks the newest interpreter on the box — so testing only the
        # floor would leave the version most people actually run unexercised.
        # Hence 3.14 on merge pushes and one dedicated daily schedule, both
        # of which run the whole suite. The other seven scheduled promotion
        # windows intentionally carry only the required 3.12 context.
        #
        # If newer interpreters are ever deliberately unsupported, the honest fix
        # is a `requires-python` upper bound, not a quiet single-leg matrix.
        #
        # The full set is EVERY version the wheel's classifiers advertise, so
        # "declared" and "tested" cannot drift apart: 3.13 was claimed but never
        # exercised, which is the same species of lie as an untested 3.10 claim.
        # Three legs on pushes is also what this job carried before the floor moved
        # (3.10/3.11/3.12). `max-parallel` above controls their fan-out without
        # weakening the version coverage.
        # Pull requests and the seven frequent schedules are the fallthrough. If
        # another trigger is added, classify its version coverage explicitly.
        python-version: ${{ (github.event_name == 'push' || github.event.schedule == '17 9 * * *') && fromJSON('["3.12", "3.13", "3.14"]') || fromJSON('["3.12"]') }}
    env:
      # Pin BLAS/OpenMP to one thread per leg. This suite runs SERIALLY, yet each
      # leg burned ~316% CPU on the self-hosted box -- numpy spawning threads to
      # fill the core quota. Three legs doing that pinned load at 15/16 and made
      # every leg ~1.9x SLOWER than the same leg on a GitHub VM (which never
      # contends, because each matrix leg gets its own machine).
      #
      # Pinning frees ~13 of 16 cores, which pytest-xdist (see PYTEST_ADDOPTS
      # below) spends on real parallelism. The original `-n 4` benchmark cut
      # 45.5/44.0/47.5 min to 15.8/16.6/16.9 with the same 6261 passed / 288
      # skipped and 86.44% coverage, but CPU quota is not the only bound.
      #
      # Do NOT "improve" `-n 2` to `-n auto`. xdist's auto reads os.cpu_count(),
      # which inside the runner container reports the HOST's 16 -- not the 4-CPU
      # cgroup quota (sched_getaffinity says 16 too; only /sys/fs/cgroup/cpu.max
      # tells the truth). `auto` would start 16 workers per leg against 4 CPUs.
      #
      # Set here rather than in the runner image so hosted and self-hosted legs
      # execute identically -- divergence between the two is what produced the
      # #839-style "matrix is not real" failure earlier in this branch.
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      # Worker count must fit both the MACHINE and the runner cgroup. Four
      # coverage-traced workers plus the controller repeatedly reached the
      # obsidian slot's exact 12 GiB memory.max. Three workers still reached
      # 12.59 GB in a matching capped run (9.60 GB anonymous RSS), leaving under
      # 300 MB. Two workers completed at a 10.28 GB peak with zero cgroup max,
      # OOM, or OOM-kill events, retaining parallelism without the hard limit.
      # `--dist loadfile` also keeps each file's shared fixtures on one worker,
      # matching the repository's parallel test contract instead of rebuilding
      # them as xdist's default load scheduler moves individual tests around.
      #
      # `-n 4` on a GitHub-hosted VM killed all three legs at 97-98% complete
      # with exit 143 + "the runner has received a shutdown signal" -- four
      # workers each importing torch/napari/scipy exhaust a 2-core hosted VM and
      # the OOM killer takes the runner agent with them. That would have broken
      # the fork/manual-hosted path.
      #
      # Hosted stays serial (about 1h17m in recent hosted runs).
      # PYTEST_ADDOPTS is read by pytest itself, so the shared `test-cov` script
      # stays machine-agnostic for local use.
      PYTEST_ADDOPTS: ${{ needs.pick-runner.outputs.label == 'obsidian' && '-n 2 --dist loadfile' || '' }}
    steps:
      - name: Free disk space on hosted runners
        # The full suite exhausts the ~14 GB GitHub-hosted runner and fails with
        # `[Errno 28] No space left on device`, turning forced-hosted runs red
        # (#1816). Reclaim
        # preinstalled tooling we never use. obsidian has ample disk, so skip it
        # there.
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      # LFS intentionally disabled. Payload-dependent tests detect unpulled
      # pointer stubs and skip themselves. `check-data-manifest` still catches
      # pointer/manifest drift, and the Visible Human pair has an additional
      # CI-runnable manifest pin. Keeping `lfs: true` here made every PR's
      # checkout fail catastrophically when the repo's GitHub LFS budget was
      # exhausted; the LFS pointer files in the work tree are sufficient.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: setup-python
        if: needs.changes.outputs.dom_py != 'false'
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        if: needs.changes.outputs.dom_py != 'false'
        # Install Hatch ON the matrix interpreter. Hatch builds an environment
        # that declares no `python` with whatever interpreter Hatch ITSELF runs
        # under ("Prefer the Python version Hatch is currently using",
        # hatch/env/virtual.py), so a plain `pipx install hatch` pins every env
        # to the runner's default Python and the matrix value never reaches the
        # tests — all three legs silently ran 3.12. See #839.
        run: pipx install --python "${{ steps.setup-python.outputs.python-path }}" hatch

      - name: Assert hatch uses the matrix interpreter
        if: needs.changes.outputs.dom_py != 'false'
        # The guard that #839 was missing. It must compare for EQUALITY: a floor
        # check (`>= 3.12`, scripts/check_hpc_setup.py) passes happily on ANY
        # newer interpreter, which is how the matrix stayed decorative for so
        # long. Still load-bearing with one leg: it proves the hatch env really
        # runs the version this job claims, rather than whatever pipx picked.
        #
        # NB: no braces in the -c snippet. `hatch run` expands `{...}` as its own
        # template context, so an f-string like f"{sys.version_info.major}" dies
        # with "Unknown context field `sys`" instead of printing a version.
        run: |
          want="${{ matrix.python-version }}"
          got=$(hatch run python -c "import sys; print(sys.version_info.major, sys.version_info.minor, sep='.')")
          echo "matrix=$want hatch-env=$got"
          if [ "$want" != "$got" ]; then
            echo "::error::hatch env runs $got but this leg is $want — the matrix is not real (see #839)"
            exit 1
          fi

      - name: Audit Python dependencies
        if: needs.changes.outputs.dom_py != 'false'
        run: |
          hatch run python -m pip install pip-audit
          hatch run python -m pip_audit --desc --skip-editable
        continue-on-error: true

      # The gates below judge the SOURCE, not the runtime (ruff target-version
      # py312, mypy python_version 3.12), so they run once — on the 3.12 leg —
      # while staying under the required `python-tests (3.12)` context.
      # The target list is the project's own (`hatch run lint`), not just the
      # package. It used to be `packages/luxar/src/luxar/` alone, which left
      # `scripts/` (121 files, 35K LOC — including every gate implementation),
      # `scripts/benchmarks/`, `stats/` and `hatch_build.py` with no E/W/F/I
      # check in CI at all (audit A12-04). The gates that guard this repository
      # were the least-checked code in it.
      - name: Lint (ruff)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        run: >-
          hatch run python -m ruff check
          packages/luxar/src scripts scripts/benchmarks stats hatch_build.py

      # Formatting was enforced ONLY by the opt-in pre-commit hook, which sees
      # the STAGED files and nothing else — so 10 files had drifted unformatted
      # in the tree with no gate able to notice. Same targets as the lint above.
      # `[tool.ruff.format] exclude = ["*.md"]` keeps this to Python; see the
      # rationale in pyproject.toml.
      - name: Format check (ruff)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        run: >-
          hatch run python -m ruff format --check
          packages/luxar/src scripts scripts/benchmarks stats hatch_build.py

      - name: Type check (mypy)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        run: hatch run mypy packages/luxar/src/luxar/ scripts/ci_queue_scan.py

      - name: Layer check (import-linter)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        # Enforce the full subpackage stack plus the narrower forbidden contracts.
        run: hatch run lint-imports

      - name: Layer order and debt ratchet
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        run: hatch run check-layer-order

      - name: Version consistency (Python == viewer == citation)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        run: hatch run python scripts/check_version_consistency.py

      - name: Format contract drift (Python <-> TypeScript)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        # The generated typing_utils/_format_contract.py + viewer
        # types/format-contract.ts must match format-contract/contract.yaml.
        run: hatch run check-contract

      - name: Demo data manifest drift
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        # demos/data_manifest.json must match the demos/data tree. Safe without
        # `git lfs pull`: the generator reads each file's sha256 + size from its
        # LFS *pointer* when the payload is not materialized, so this needs
        # neither the git-lfs binary nor LFS bandwidth (see the checkout note
        # above).
        run: hatch run check-data-manifest

      - name: Demo documentation count drift
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        # README.md, CLAUDE.md and the visualization skill must match the live
        # demo registry and focused-example glob.
        run: hatch run check-demo-counts

      - name: Security (bandit)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        # Gates on unwaived medium/high findings. Low findings (subprocess
        # usage, etc.) and demos are out of scope; see [tool.bandit].
        run: hatch run security

      - name: Native compile check (CUDA/Metal, no GPU)
        if: matrix.python-version == '3.12' && needs.changes.outputs.dom_py != 'false'
        # ~3,900 lines of CUDA/Metal ride into the wheel as a second and third
        # implementation of the splat-rasterization maths (A15-03). This
        # compile-only gate needs no GPU. The ubuntu runner checks the host
        # translation units (one also needs CUDA headers when available) and
        # reports the unavailable `metal`/`nvcc` arms as SKIP.
        #
        # `--require cxx` is the point of the flag: without it a runner that
        # somehow lost its C++ compiler would SKIP and report green over
        # nothing. The Metal and CUDA arms are deliberately NOT required here
        # -- they cannot exist on ubuntu -- so full coverage of those two waits
        # on a macOS runner and a CUDA image respectively (#2544).
        run: hatch run check-native --require cxx

      - name: Test with coverage
        if: needs.changes.outputs.dom_py != 'false'
        run: hatch run test-cov

  typescript-tests:
    needs: [changes, pick-runner]
    # Fail-safe fallback to full CI if `changes` fails — see the note on the
    # `changes` job.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.pick-runner.outputs.label || 'ubuntu-latest' }}
    # 120, not 60: a successful TypeScript attempt ran 17m53s of real steps; at
    # the documented 3.3x SCHED_IDLE extreme, a healthy starved run projects to
    # roughly 59 minutes, leaving the former 60-minute budget no headroom for any
    # pre-step dispatch latency. A dispatch-lost leg can spend the same budget
    # without starting a step. The cost is doubled time-to-red and delayed stale
    # diagnosis for that leg; on the hosted fork/override branch it also doubles
    # hang detection and worst-case billed time. release-readiness keeps 30
    # because its hosted runner is not exposed to SCHED_IDLE starvation.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: packages/luxar-viewer
    env:
      # Enforce the WASM-vs-TS parity tests at the smoke-check level. Without
      # this, the parity harness silently skips on missing WASM artefacts; the
      # WASM build step below populates public/wasm/ so the harness runs the
      # real comparison and the smoke test verifies the artefacts are present.
      LUXAR_REQUIRE_WASM_TESTS: '1'
    steps:
      - name: Free disk space on hosted runners
        # See python-tests: reclaim preinstalled tooling on GitHub-hosted runners
        # so the WASM build + suite do not hit `[Errno 28] No space left
        # on device` (#1816). Skipped on the self-hosted box.
        if: runner.environment == 'github-hosted'
        working-directory: ${{ github.workspace }}
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Rust toolchain
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        # Pinned to a SHA, so the toolchain channel must be given explicitly
        # (matches rust-toolchain.toml in packages/luxar-viewer/src/wasm/rust).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown
          # Explicit, even though rust-toolchain.toml also lists it: this action
          # pins the toolchain by input and installs the minimal profile, so the
          # clippy gate below would otherwise depend on which of the two rustup
          # happens to consult first.
          components: clippy

      - name: Cache cargo build
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: packages/luxar-viewer/src/wasm/rust

      # clippy ran NOWHERE in CI (audit A12-02). `cargo check` reaches CI only
      # as a side effect of `pnpm build` -> wasm-pack, and `make check-rust` —
      # the one place clippy was invoked at all — could not fail: the recipe is
      # a single backslash-joined shell command that ended `; echo "...passed!"`,
      # making the echo's status the target's. Verified with a minimal recipe of
      # the same shape: `false && true; echo PASSED` exits 0. The Makefile is
      # fixed in the same commit; this is the half that gates a PR.
      #
      # Nearly free here: the toolchain and cargo cache are already set up above
      # for the WASM build, and a warm clippy over this crate takes ~7s.
      # `--all-targets` lints test and bench code too, matching the Makefile.
      - name: Lint Rust (clippy)
        if: needs.changes.outputs.dom_rust != 'false'
        working-directory: packages/luxar-viewer/src/wasm/rust
        run: cargo clippy --all-targets -- -D warnings

      - name: Install wasm-pack
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # jetli downloads the GitHub release binary, whose tag/asset use a
          # 'v' prefix (wasm-pack-v0.15.0-...). The version string is used
          # verbatim, so it MUST include the 'v' or the download 404s.
          version: 'v0.15.0'

      # Runs BEFORE the install, deliberately. The failure this guards against
      # (overrides split between package.json and pnpm-workspace.yaml, so
      # Dependabot's lockfile disagrees with what pnpm computes) surfaces as
      # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH from the frozen install itself, which
      # names neither file. Checking first means the PR that needs the
      # explanation is the one that gets it. Pure stdlib node, no node_modules.
      - name: Check pnpm overrides are single-sourced
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: node scripts/check-overrides.mjs

      - run: pnpm install --frozen-lockfile
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')

      - name: Audit TypeScript dependencies
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Build WASM so the WASM-vs-TS parity tests actually run (instead of
      # silently skipping on a missing artefact, which previously meant the
      # parity harness was dormant in CI). Combined with
      # LUXAR_REQUIRE_WASM_TESTS=1 above, a missing artefact now hard-fails.
      - name: Build WASM module
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: pnpm run build:wasm

      - name: Rust unit tests (cargo test)
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        # The WASM kernels have 73 native Rust unit tests + the TS-parity
        # harness; run them on the host target (not wasm32) so they gate PRs.
        working-directory: packages/luxar-viewer/src/wasm/rust
        run: cargo test

      # Generate test fixtures (requires Python)
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          python-version: '3.12'

      - name: Install Hatch
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: pipx install hatch

      - name: Verify fixture environment is lean and CPU-only
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        working-directory: .
        run: hatch run fixtures:python scripts/check_fixture_env.py

      - name: Generate test fixtures
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        working-directory: packages/luxar-viewer
        run: pnpm test:generate-fixtures

      - name: Check (overrides + typecheck + lint + layers + knip + coverage)
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        # `pnpm run check:ci` runs in this order:
        #   check:overrides (security pins single-sourced in pnpm-workspace.yaml)
        #   → typecheck → lint → check:layers (dependency-cruiser)
        #   → check:knip:ci (dead-file + unlisted-dependency gate)
        #   → test:coverage (vitest with thresholds)
        #   → check:coverage-slack (reject stale or empty coverage floors)
        # knip:ci runs with --include files,dependencies so policy-level
        # "unused exports" findings (test builders, type guards) don't fail
        # CI; only true dead files and unlisted deps do.
        run: pnpm run check:ci

  release-readiness:
    needs: [changes]
    # Fail-safe fallback to full CI if `changes` fails — see the note on the
    # `changes` job.
    if: ${{ !cancelled() }}
    # This one-minute check does not need scarce obsidian capacity and must not
    # delay the required merge context behind unrelated matrix work.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/luxar-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Rust toolchain
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: packages/luxar-viewer/src/wasm/rust

      - name: Install wasm-pack
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          # jetli downloads the GitHub release binary, whose tag/asset use a
          # 'v' prefix (wasm-pack-v0.15.0-...). The version string is used
          # verbatim, so it MUST include the 'v' or the download 404s.
          version: 'v0.15.0'

      # Same pre-install guard as typescript-tests — this job's frozen install
      # fails identically on an overrides mismatch, so it gets the same legible
      # message instead of a bare ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.
      - name: Check pnpm overrides are single-sourced
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: node scripts/check-overrides.mjs

      - run: pnpm install --frozen-lockfile
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')

      - name: Build library bundle (with WASM)
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: pnpm run ci:release

      - name: Generate tarball manifest (npm pack --dry-run)
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: npm pack --dry-run --json | tee /tmp/pack.json

      - name: Verify tarball contents
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        # The tarball must contain:
        #   - LICENSE at the package root
        #   - dist/lib/luxar-viewer.js (the publishable barrel)
        #   - at least one wasm asset (vite emits to dist/lib/assets/)
        #   - at least one worker asset (data-worker / sort-worker)
        # Each grep is a packaging assertion for the publishable tarball.
        run: |
          jq -r '.[0].files[].path' /tmp/pack.json > /tmp/pack-files.txt
          echo "--- Tarball contents ---"
          cat /tmp/pack-files.txt
          echo "--- Verifications ---"
          grep -qE '^LICENSE$' /tmp/pack-files.txt || { echo "Missing LICENSE"; exit 1; }
          grep -qE '^dist/lib/luxar-viewer\.js$' /tmp/pack-files.txt || { echo "Missing dist/lib/luxar-viewer.js"; exit 1; }
          grep -qiE 'wasm' /tmp/pack-files.txt || { echo "Missing WASM asset"; exit 1; }
          grep -qiE 'worker' /tmp/pack-files.txt || { echo "Missing worker asset"; exit 1; }
          echo "All release-readiness assertions passed."

  # Build the second release product in an isolated job. `release-readiness`
  # validates the npm library bundle; this job runs the exact application build
  # whose `dist/` directory is force-included in the PyPI wheel. Keeping the two
  # jobs separate prevents their `emptyOutDir` Vite builds from clobbering one
  # another and gives branch protection an unambiguous wheel-viewer signal.
  wheel-viewer:
    needs: [changes]
    # Required checks must report explicitly even for docs-only changes, and a
    # failed change detector must fall back to the full build rather than skip.
    if: ${{ !cancelled() }}
    # Keep the second one-minute release build off the constrained runner pool
    # and independent of unrelated matrix jobs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/luxar-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          # Read the exact packageManager pin used by local/Corepack installs.
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Set up Rust (for WASM build)
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          # Match rust-toolchain.toml and the other required TypeScript jobs.
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown

      - name: Cache cargo build
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: packages/luxar-viewer/src/wasm/rust

      - name: Install wasm-pack
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: 'v0.15.0'

      - run: pnpm install --frozen-lockfile
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')

      - name: Build viewer application (the dist bundled into the wheel)
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        # Keep the install + build sequence identical to publish.yml; this job
        # expresses the package directory through defaults.working-directory.
        run: pnpm build

      - name: Verify wheel-viewer assets
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: |
          set -euo pipefail
          test -s dist/index.html \
            || { echo "::error::viewer dist missing index.html"; exit 1; }
          entry=$(sed -n 's#.*src="\([^"]*/assets/index-[^"]*\.js\)".*#\1#p' dist/index.html | head -1)
          test -n "$entry" && test -s "dist/${entry#/}" \
            || { echo "::error::viewer dist missing its application entry bundle"; exit 1; }
          test -s dist/wasm/luxar_wasm_bg.wasm \
            || { echo "::error::viewer dist missing the production WASM binary"; exit 1; }
          find dist/assets -maxdepth 1 -type f -name 'data-worker-*.js' -print -quit | grep -q . \
            || { echo "::error::viewer dist missing the data worker"; exit 1; }
          find dist/assets -maxdepth 1 -type f -name 'sort-worker-*.js' -print -quit | grep -q . \
            || { echo "::error::viewer dist missing the depth-sort worker"; exit 1; }
          echo "Wheel viewer application and critical assets are present."

      # ---------------------------------------------------------------------
      # The PYTHON wheel, built from the dist just verified above.
      #
      # Nothing built, inspected or installed it until a release tag was pushed:
      # `hatch build` appeared exactly once in the repo, in publish.yml on `v*`
      # (audit A12-01). The npm side already had this gate — `release-readiness`
      # — and the Python side never mirrored it. A `.gitignore` pattern once
      # matched a package directory, hatchling dropped it from the wheel, every
      # test stayed green (they import from the source tree), and the break
      # surfaced only as `luxar --version` failing on a clean install.
      #
      # It lives in THIS job rather than a new one because the viewer dist it
      # force-includes has just been built here; a separate job would repeat the
      # pnpm + Rust + wasm build to produce the same bytes. `wheel-viewer` is
      # already a required context, so this gates every PR without a
      # branch-protection change.
      # ---------------------------------------------------------------------
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          # 3.12 is the floor `requires-python` declares; a wheel that installs
          # and runs there installs and runs on 3.13/3.14 too.
          python-version: '3.12'

      - name: Build the Python wheel
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        working-directory: ${{ github.workspace }}
        # Identical to publish.yml's build, so this gate proves the artifact the
        # release actually produces rather than a lookalike.
        run: |
          python -m pip install --upgrade hatch
          hatch build

      - name: Inspect the wheel contents
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        working-directory: ${{ github.workspace }}
        # Asserts package completeness against the source tree, that every
        # `exclude` pattern in pyproject was honoured, that no Git-LFS pointer
        # stub shipped in place of data, that nothing exceeds PyPI's 100 MB
        # per-file limit, and that the viewer dist is bundled. All derived from
        # the repository, so the gate cannot drift from what it guards.
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl)"
          python scripts/check_wheel.py "$WHEEL"

      - name: Install the wheel into a bare venv and run it
        if: (needs.changes.outputs.dom_py != 'false' || needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        working-directory: ${{ github.workspace }}
        # The half no static inspection can do. A wheel can hold every expected
        # member and still fail to import — a missing runtime dependency, a
        # broken entry point, a module importable only from the source tree.
        # Deliberately a CLEAN venv with no dev extras and no repo on sys.path:
        # running from the checkout is how the dropped-package bug stayed
        # invisible for as long as it did.
        run: |
          set -euo pipefail
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/wheel-venv/bin/python -m pip install --quiet "$(ls dist/*.whl)"
          # An EMPTY directory, not just "not the checkout". Python puts the
          # working directory on sys.path, so any stray `inspect.py`/`types.py`
          # sitting in a shared scratch dir shadows the stdlib and fails the
          # import with an error about the wheel. (Hit exactly this locally.)
          mkdir -p /tmp/wheel-smoke && cd /tmp/wheel-smoke
          /tmp/wheel-venv/bin/luxar --version
          /tmp/wheel-venv/bin/luxar --help > /dev/null
          /tmp/wheel-venv/bin/python -c "import luxar; print('import OK:', luxar.__version__)"

  # A scheduled run can put fresh successful checks on the same SHA as an older
  # cancelled push run, but branch protection's rollup can retain the cancelled
  # duplicate for each required context. Once this run has proved the five
  # protected contexts green, walk commits still ahead of main through DEV'S TIP
  # newest first and rerun cancelled required jobs from up to two push suites.
  # This repairs skipped commits without an unbounded runner burst.
  #
  # The walk anchors on dev's tip resolved EXPLICITLY (git/refs/heads/dev), NOT
  # on the scheduled run's own ref/SHA: GitHub runs schedules on the default
  # branch, so ${GITHUB_SHA} is `dev`'s tip only while `dev` is the default. Once
  # the default flips to `main`, ${GITHUB_SHA} is main's tip, `main...${GITHUB_SHA}`
  # collapses to `main...main`, the walk finds nothing, and promotion stalls
  # SILENTLY. The checkout + guard below assert the resolved SHA really is
  # origin/dev's tip and fail LOUDLY otherwise, because this failure has no other
  # red signal.
  repair-cancelled-push-checks:
    needs:
      [changes, python-tests, typescript-tests, release-readiness, wheel-viewer, docs-quality]
    if: ${{ github.event_name == 'schedule' && always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      # Use the same dev commit as the suite so the guard can cross-check it
      # against git's current view of origin/dev. Keep checkout credentials: the
      # next step must fetch that tracking ref from this private repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - name: Rerun cancelled required push jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            "python-tests (3.12)"
            "typescript-tests"
            "release-readiness"
            "wheel-viewer"
            "docs-quality"
          )
          current_jobs=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100")
          for context in "${required[@]}"; do
            conclusion=$(jq -r --arg context "$context" \
              '[.[] | .jobs[] | select(.name == $context)] | max_by(.id).conclusion // "absent"' \
              <<<"$current_jobs")
            if [ "$conclusion" != "success" ]; then
              echo "Required scheduled context is not green: $context=$conclusion"
              exit 0
            fi
          done

          # PRECONDITION GUARD: scheduled runs are dispatched on the repository
          # default branch, and this workflow only serves promotion while that
          # branch is dev. Ask that question directly rather than inferring it
          # from commit topology, where a caught-up main tip is indistinguishable
          # from the scheduled event SHA after the default-branch flip.
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" \
            --jq '.default_branch') || default_branch=""
          if [ -z "$default_branch" ]; then
            echo "::error::could not resolve the repository default branch; cannot verify that this scheduled run belongs to dev -- failing loudly rather than risking a silent pass"
            exit 1
          fi
          if [ "$default_branch" != "dev" ]; then
            echo "::error::scheduled runs are dispatched on '$default_branch', not dev; this promotion window cannot attest dev after the default-branch flip -- refusing to walk"
            exit 1
          fi

          # Resolve dev's tip EXPLICITLY as the WALK ANCHOR. ${GITHUB_SHA} is the
          # scheduled event's immutable dev commit, but dev may advance while the
          # window runs, so the repair must walk through the current tip.
          dev_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/dev" \
            --jq '.object.sha') || dev_sha=""
          if [ -z "$dev_sha" ]; then
            echo "::error::could not resolve refs/heads/dev; a scheduled promotion run must walk dev's tip -- failing loudly rather than silently skipping repair"
            exit 1
          fi

          # Cross-check that the immutable event commit remains on dev's line.
          # HEAD normally equals origin/dev, but a merge landing during the window
          # leaves HEAD behind the tip. That older ancestor is healthy; any commit
          # outside dev's ancestry is an unknown checkout and fails closed.
          git fetch -q origin +refs/heads/dev:refs/remotes/origin/dev
          origin_dev=$(git rev-parse origin/dev)
          head_sha=$(git rev-parse HEAD)
          if [ "$head_sha" != "$origin_dev" ]; then
            if git merge-base --is-ancestor "$head_sha" "$origin_dev"; then
              # HEAD is an ANCESTOR of dev's tip: a merge landed between checkout
              # and this read. Benign -- the walk anchor `dev_sha` is resolved
              # fresh from the API, so the repair still targets dev's real tip.
              echo "note: dev advanced since checkout ($head_sha -> $origin_dev), a merge landed between checkout and this read; benign -- the walk anchor dev_sha is resolved fresh"
            else
              echo "::error::checked out $head_sha is not an ancestor of origin/dev ($origin_dev) -- unknown branch; refusing to walk"
              exit 1
            fi
          fi
          echo "Walking commits ahead of main through dev tip $dev_sha (checked out $head_sha; scheduled run SHA ${GITHUB_SHA})"

          comparison=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/compare/main...${dev_sha}?per_page=100")
          candidate_shas=$(jq -r '[.[] | .commits[]?.sha] | reverse[]' <<<"$comparison")
          if [ -z "$candidate_shas" ]; then
            # Guaranteed benign by the guard above: the walk really is on dev, so
            # an empty compare means dev is level with main (nothing to promote).
            echo "No commits ahead of main through dev (${dev_sha}); dev is level with main -- nothing to promote"
            exit 0
          fi

          required_json=$(printf '%s\n' "${required[@]}" \
            | jq -Rsc 'split("\n") | map(select(length > 0))')
          repair_count=0
          repair_limit=2
          while IFS= read -r candidate_sha; do
            if [ "$repair_count" -ge "$repair_limit" ]; then
              echo "Repair cap reached; older candidates intentionally skipped"
              break
            fi
            if ! push_run=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${candidate_sha}&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "CI")] | max_by(.id).id // empty'); then
              echo "::warning::API query failed for $candidate_sha; continuing backlog repair"
              continue
            fi
            if [ -z "$push_run" ]; then
              echo "No completed push CI run found for $candidate_sha"
              continue
            fi

            if ! push_jobs=$(gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${push_run}/jobs?filter=latest&per_page=100"); then
              echo "::warning::API query failed for $candidate_sha; continuing backlog repair"
              continue
            fi
            cancelled_jobs=$(jq -r --argjson required "$required_json" '
              [.[] | .jobs[]]
              | group_by(.name)[]
              | max_by(.id)
              | select(
                  .conclusion == "cancelled"
                  and (.name | IN($required[]))
                )
              | [.id, .name]
              | @tsv
            ' <<<"$push_jobs")
            if [ -z "$cancelled_jobs" ]; then
              echo "No cancelled required push jobs found for $candidate_sha"
              continue
            fi

            # `tr -d " "` because BSD wc pads its count ("       3") while GNU wc
            # does not. CI is Linux so the padding never showed there, but it made
            # the harness test red on every macOS checkout and would have landed a
            # padded count in the warning text if this ever ran on a Mac runner.
            cancelled_count=$(wc -l <<<"$cancelled_jobs" | tr -d ' ')
            if [ "$cancelled_count" -gt 1 ]; then
              echo "Rerunning unsuccessful push jobs for $candidate_sha after finding $cancelled_count cancelled required jobs"
              if gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${push_run}/rerun-failed-jobs" >/dev/null; then
                repair_count=$((repair_count + 1))
              else
                echo "::warning::rerun rejected for push run $push_run ($candidate_sha; $cancelled_count cancelled required jobs)"
              fi
              continue
            fi

            IFS=$'\t' read -r job_id job_name <<<"$cancelled_jobs"
            echo "Rerunning cancelled push job for $candidate_sha: $job_name ($job_id)"
            if gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/jobs/$job_id/rerun" >/dev/null; then
              repair_count=$((repair_count + 1))
            else
              echo "::warning::rerun rejected for $job_name ($job_id; $candidate_sha)"
            fi
          done <<<"$candidate_shas"

  go-launcher:
    needs: changes
    # Fail-safe fallback to full CI if `changes` fails — see the note on the
    # `changes` job.
    if: ${{ !cancelled() }}
    # Pinned to 22.04: the launcher's webview_go (latest available) links
    # webkit2gtk-4.0 via pkg-config, and ubuntu-24.04 (ubuntu-latest) ships only
    # the 4.1 dev package. 22.04 provides libwebkit2gtk-4.0-dev.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/luxar-launcher
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.dom_go != 'false'
        with:
          go-version: '1.22'
          cache-dependency-path: packages/luxar-launcher/go.sum

      - name: Install WebView build deps (cgo)
        if: needs.changes.outputs.dom_go != 'false'
        # The launcher binds github.com/webview/webview_go, which is cgo over
        # WebKitGTK; go vet/build/test must compile the C bindings. webview_go
        # links webkit2gtk-4.0, so install the 4.0 dev package (present on 22.04).
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev pkg-config

      - name: go vet
        if: needs.changes.outputs.dom_go != 'false'
        run: go vet ./...

      - name: go build
        if: needs.changes.outputs.dom_go != 'false'
        run: go build ./...

      - name: go test
        if: needs.changes.outputs.dom_go != 'false'
        run: go test ./...

  # Narrow browser gate for the TSL↔GLSL shader cone — the ONLY equivalence
  # check the dual-backend shaders have.
  #
  # Deliberately distinct from the disabled `e2e-tests` job below. That job's
  # rationale is that software WebGL is too slow and unreliable for
  # RENDERING-DEPENDENT specs — specs that load datasets and compare rendered
  # frames against baselines. `tsl-shader-parity` is not that class: it renders
  # a 64×64 canvas through BOTH backends (`WebGLRenderer` vs
  # `WebGPURenderer({ forceWebGL: true })`) and compares them to EACH OTHER, so
  # rasterizer identity cancels out and llvmpipe is not merely tolerable, it is
  # the deterministic choice. It reads no zarr fixtures, no example datasets and
  # no LFS payloads, takes no screenshots, and imports `test` from
  # `@playwright/test` directly — skipping the per-spec console-error teardown
  # that dominates E2E wall clock.
  #
  # Pinned to ubuntu-latest on purpose: NOT routed through pick-runner, so it
  # neither draws obsidian capacity nor flips between a real GPU and llvmpipe
  # (which would be a flake source for a pixel comparison).
  #
  # No `pnpm build:wasm`: the harness's transitive imports stop at
  # rendering/{point,line,gsplat,mesh}-geometry and element-storage, and the
  # vite dev server only transforms what is imported.
  #
  # `tsl-codegen-snapshot.spec.ts` is deliberately NOT run here — it pins
  # literal generated GLSL including a capability-derived precision/extensions
  # preamble recorded on a GPU box, and `ignoreSnapshots` is false on Linux.
  #
  # NOT YET REQUIRED. Until `tsl-parity` is added to the branch-protection
  # contexts (which also needs repair-cancelled-push-checks + the exact-equality
  # assertions in test_ci_diff_classifier.py), a red run here does not block a
  # merge. Promote it after a few green runs.
  tsl-parity:
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/luxar-viewer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs test the captured dev commit; empty on push/PR == default.
          ref: ${{ needs.changes.outputs.dev_sha || '' }}

      # playwright.config.ts starts a second webServer — tools/range-http-server.py
      # — for every run, and global-setup probes both servers' identity markers.
      # The parity spec reads no dataset, but the server must still come up.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install viewer dependencies
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: npx playwright install --with-deps chromium

      - name: Install software OpenGL for headless WebGL
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libegl-mesa0 libgbm1

      - name: TSL ↔ GLSL shader parity
        if: (needs.changes.outputs.dom_ts != 'false' || needs.changes.outputs.dom_rust != 'false')
        run: pnpm playwright test tsl-shader-parity.spec.ts --workers=1 --retries 2
        env:
          CI: true
          LUXAR_E2E_NO_FIXTURES: '1'

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsl-parity-report
          path: packages/luxar-viewer/test-results/
          retention-days: 7

  # E2E tests disabled — software WebGL on standard ubuntu-latest runners is
  # too slow and unreliable for rendering-dependent specs. Run locally with:
  # make test-e2e.
  #
  # The job below is a ready-to-go smoke subset (interaction-focused specs,
  # datasets generated at runtime via `make run-examples`, no LFS needed) —
  # re-enabling is a one-line change (drop `if: false`) once we accept the
  # software-rendering flakiness risk or get GPU-capable runners
  # (GitHub GPU runner beta, or a self-hosted runner with NVIDIA driver +
  # EGL software fallback that still satisfies WebGL2).
  e2e-tests:
    if: false
    needs: [python-tests, typescript-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The smoke subset generates its example datasets at runtime via
      # `make run-examples` (see step below) — none of the LFS-backed
      # demo fixtures are read by the smoke specs. Keeping `lfs: true`
      # made the checkout step itself fail when the repo's LFS budget
      # was exhausted. If a future e2e job actually needs the demo
      # payloads, re-enable `lfs: true` on that job specifically.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: packages/luxar-viewer/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Hatch
        run: pipx install hatch

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd packages/luxar-viewer && npx playwright install --with-deps chromium

      - name: Install software OpenGL for headless WebGL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1-mesa-dri libegl-mesa0 libgbm1

      - name: Generate example datasets
        run: make run-examples

      # Use the package-level smoke script as the source of truth so a
      # workflow re-enable stays aligned with the local
      # `pnpm test:e2e:smoke` definition.
      - name: Run E2E smoke (CI subset)
        run: cd packages/luxar-viewer && pnpm test:e2e:smoke
        timeout-minutes: 45
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: packages/luxar-viewer/test-results/
          retention-days: 7
