name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pipx install hatch

      - name: Lint (ruff)
        run: hatch run python -m ruff check packages/luxar/src/luxar/

      - name: Type check (mypy)
        run: hatch run mypy packages/luxar/src/luxar/

      - name: Test with coverage
        run: hatch run test-cov

  typescript-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/luxar-viewer
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - run: pnpm install

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      # Generate test fixtures (requires Python)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hatch
        run: pipx install hatch

      - name: Generate test fixtures
        working-directory: .
        run: hatch run python packages/luxar-viewer/tests/fixtures/generate_test_data.py

      - name: Unit tests
        run: pnpm test --run

  e2e-tests:
    needs: [python-tests, typescript-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Install Hatch
        run: pipx install hatch

      - name: Install viewer dependencies
        run: cd packages/luxar-viewer && pnpm install

      - name: Install Playwright browsers
        run: cd packages/luxar-viewer && npx playwright install --with-deps chromium

      - name: Generate example datasets
        run: make run-examples

      - name: Run E2E tests
        run: cd packages/luxar-viewer && pnpm test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/luxar-viewer/test-results/
          retention-days: 7
