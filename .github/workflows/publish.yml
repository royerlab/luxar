# Publish Luxar to PyPI via Trusted Publishing (GitHub Actions OIDC).
#
# Trigger: pushing a version tag (e.g. `v2026.06.29`). The tag MUST match the
# package version in packages/luxar/src/luxar/__init__.py (CalVer `YYYY.MM.DD`,
# zero-padded) or the build fails fast before anything is published. Cut releases
# with `make release` (never `hatch publish` — see pyproject `[tool.hatch.publish]`).
#
# The wheel force-includes packages/luxar-viewer/dist (see [tool.hatch...
# force-include] in pyproject.toml), so the viewer is built BEFORE `hatch build`.
# Wheels are the supported artifact; the sdist is provenance-only (no viewer).
# Native launchers are host-specific and intentionally NOT bundled — the wheel
# stays py3-none-any and `luxar export --native` tells users to build them.
#
# Third-party actions are pinned by commit SHA (repo convention) for supply-chain
# safety. One-time setup (already done): PyPI trusted publisher (owner=royerlab,
# repo=luxar, workflow=publish.yml, env=pypi) + GitHub `pypi` environment
# (restricted to `v*` tags). The TestPyPI dry-run path additionally needs a
# TestPyPI trusted publisher + the `testpypi` environment.
name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build only; publish to TestPyPI instead of PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up Rust (for WASM build)
        # Pinned to a SHA, so the toolchain channel must be given explicitly —
        # the same reasoning (and the same version) as ci.yml. Without it this
        # step resolved the toolchain implicitly, so the artifact that actually
        # ships was built by a step configured differently from the one CI
        # tests. Keep in sync with ci.yml and
        # packages/luxar-viewer/src/wasm/rust/rust-toolchain.toml.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.92.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@0d096b08b4e5a7de8c28de67e11e945404e9eefa # v0.4.0
        with:
          version: "v0.15.0" # pinned to match ci.yml (deterministic, not 'latest')

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Read the viewer manifest's exact packageManager pin, matching CI,
          # docs, and npm publish. pnpm >=10.6 is required to read the security
          # overrides from the packages-less pnpm-workspace.yaml.
          package_json_file: packages/luxar-viewer/package.json

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/luxar-viewer/pnpm-lock.yaml

      - name: Verify tag matches package, viewer and citation versions
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # Was a hand-rolled __version__ comparison that checked ONE of the
          # four representations. The shared gate checks all of them, so a tag
          # can no longer ship with package.json or CITATION.cff disagreeing —
          # nothing validated the citation against the tag before.
          python scripts/check_version_consistency.py --expect-tag "$GITHUB_REF_NAME"

      - name: Build viewer (WASM + dist bundled into the wheel)
        run: |
          cd packages/luxar-viewer
          pnpm install --frozen-lockfile
          pnpm build

      - name: Sanity-check the viewer dist exists
        run: |
          test -f packages/luxar-viewer/dist/index.html \
            || { echo "::error::viewer dist missing — wheel would ship a broken viewer"; exit 1; }

      - name: Install build backend
        run: python -m pip install --upgrade hatch

      - name: Build wheel (no sdist — see below)
        run: |
          set -euo pipefail
          # WHEEL ONLY. The sdist is not merely "degraded" without the viewer,
          # it cannot be installed at all: the wheel build hook raises
          # FileNotFoundError at hatch_build.py:37 when
          # packages/luxar-viewer/dist/index.html is absent, and the sdist does
          # not carry it. Measured: `python -m build --wheel` on the unpacked
          # sdist fails outright, so publishing it gives `pip install
          # --no-binary` a confusing hard failure instead of a package.
          #
          # Note the lever is `-t wheel`, NOT deleting [tool.hatch.build.targets.sdist]
          # from pyproject.toml: hatchling builds an sdist by default, so
          # removing that section would produce a LARGER one, not none.
          hatch build -t wheel

      - name: Assert no sdist is staged for upload
        run: |
          set -euo pipefail
          # Fail-closed companion to the step above: if a future change
          # reintroduces `hatch build`, the unusable sdist would be uploaded
          # again by `path: dist/` without anything going red.
          if compgen -G 'dist/*.tar.gz' > /dev/null; then
            echo "::error::an sdist is present in dist/ — it cannot be installed (see the build step) and must not be published"
            ls -l dist/
            exit 1
          fi
          echo "dist/ holds wheels only:"
          ls -l dist/

      - name: Inspect wheel
        run: |
          set -euo pipefail
          WHEEL="$(ls dist/*.whl)"
          echo "Inspecting $WHEEL"
          python scripts/check_wheel.py "$WHEEL"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish for real version tags (not workflow_dispatch dry runs).
    if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
    environment:
      name: pypi
      url: https://pypi.org/project/luxar/
    permissions:
      id-token: write # mandatory for trusted publishing (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  publish-testpypi:
    name: Publish to TestPyPI (dry run)
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    environment:
      name: testpypi
      url: https://test.pypi.org/project/luxar/
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
