# Dependabot — automated dependency + GitHub Actions update PRs.
# Covers every ecosystem in the repo so security advisories surface as PRs.
version: 2
updates:
  # Python (Hatch/pip) — root pyproject.toml
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"

  # TypeScript viewer (pnpm/npm)
  - package-ecosystem: npm
    directory: "/packages/luxar-viewer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"
    # Group families Dependabot can move together; use ignore + a CI guard when
    # a peer runtime is hand-pinned. Vitest stays exact because coverage gates merges.
    groups:
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      typescript-eslint-security:
        applies-to: security-updates
        patterns:
          - "@typescript-eslint/*"
          - "typescript-eslint"
      vitest-security:
        applies-to: security-updates
        patterns:
          - "vitest"
          - "@vitest/*"
    # Keep this aligned with .nvmrc; check:node-types enforces the #2519 contract.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Dependabot cannot update the peer runtime; check:three-types enforces the
      # THREE_VERSION_NOTES.md coupling while declaration patch updates stay automated.
      - dependency-name: "@types/three"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # Vitest's jsdom bridge reads _buffer from a private Blob impl; jsdom 30.1
      # removes the wrapper link entirely. Unpin when Vitest uses public Blob APIs.
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Rust / WASM acceleration crate
  - package-ecosystem: cargo
    directory: "/packages/luxar-viewer/src/wasm/rust"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"

  # Go native launcher
  - package-ecosystem: gomod
    directory: "/packages/luxar-launcher"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"

  # GitHub Actions — keep the SHA-pinned actions in workflows up to date.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: "dev"
